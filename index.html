<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de clientes y cobros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f8;--card:#ffffff;--ink:#1b2733;--mut:#66758a;--line:#dde3ea;
  --pri:#0f6b6b;--pri-ink:#ffffff;--pri-soft:#dff1f0;
  --ok:#1a7f4b;--ok-soft:#dcf3e6;--warn:#9a6700;--warn-soft:#fff1cc;--bad:#b42318;--bad-soft:#fde4e1;--info:#2452a4;--info-soft:#e3ebfb;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
    --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
    --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
  --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
  --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:20px;margin:0;flex:1 1 auto}
header.top .sub{color:var(--mut);font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi.bad .n{color:var(--bad)}.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{width:100%;min-height:60px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--pri)}
button.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.btn.sm{padding:4px 9px;font-size:13px}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.nm{font-weight:600}.sm{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mut{background:var(--line);color:var(--mut)}
.obs{display:flex;flex-wrap:wrap;gap:5px}
.ob{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.ob.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.ob.done::before{content:"✓ "}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#modal .bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto}
#modal .box.wide{max-width:760px}
#modal h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.fgrid input,.fgrid select{width:100%;margin-top:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2733;color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
table.ym th,table.ym td{padding:5px 4px;text-align:center}
table.ym td:first-child,table.ym th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;max-width:230px}
.cl{display:inline-block;min-width:34px;padding:3px 4px;border-radius:7px;font-size:12px;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.cl.ok{background:var(--ok-soft);color:var(--ok)}.cl.bad{background:var(--bad-soft);color:var(--bad)}
.cl.part{background:var(--warn-soft);color:var(--warn)}.cl.pend{background:var(--line);color:var(--mut)}
.cl.na{background:none;color:var(--line);cursor:default}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:6px}
.ob-item{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.ob-item input{margin:0}
.sec-title{font-size:13px;font-weight:700;color:var(--pri);margin-top:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; font-family: sans-serif; }
}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.kpi .n{font-size:22px}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>📒 Bitácora de clientes y cobros</h1>
    <span class="sub" id="stat"></span>
    <button class="btn sm danger" id="lockbtn" data-a="lockApp" style="display:none">🔒 Cerrar sesión</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
/* ============ CONSTANTES FISCALES Y CATÁLOGO ============ */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const DEFAULT_OBL=[
  {k:'F103_104',n:'F103 + F104',f:'P',m:0,d:'RUC'},
  {k:'F104_SEM',n:'F104 semestral',f:'S',m:0,d:'RUC'},
  {k:'ATS',n:'ATS',f:'P',m:0,d:'RUC'},
  {k:'RDEP',n:'RDEP',f:'A',m:1,d:'RUC'},
  {k:'AGP',n:'AGP',f:'A',m:2,d:'RUC'},
  {k:'APS',n:'APS',f:'A',m:2,d:'RUC'},
  {k:'IM_RTA',n:'Imp. Renta',f:'A',m:3,d:'RUC'},
  {k:'SUPERCIAS',n:'Supercias',f:'A',m:4,d:30},
  {k:'ADI',n:'ADI',f:'A',m:5,d:'RUC'},
  {k:'D_PATRIM',n:'D. Patrimonial',f:'A',m:5,d:'RUC'},
  {k:'PM',n:'Patente Municipal',f:'A',m:6,d:'RUC'},
  {k:'S14',n:'14.º sueldo',f:'A',m:8,d:31},
  {k:'S13',n:'13.er sueldo',f:'A',m:12,d:24}
];

const DIA_POR_DIGITO={1:10,2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,0:28};
const PERCODE={MENSUAL:'M',SEMESTRAL:'S',ANUAL:'A'};
const TIPOLBL={M:'Mensual',S:'Semestral',A:'Anual'};

/* ============ ACCESO Y GATE DE CONTRASEÑA ============ */
const GATE={logged:false};
function gateCfg(){return localStorage.getItem('bitacora_gate_pass')||''}

/* ============ ESTADO Y VARIABLES ============ */
const S={boveda:{},clientes:{},cobros:{},avances:{},config:{},catObl:{},ready:false,kind:'…'};
const loaded={};
const now=new Date();
const UI={
  ay:new Date().getFullYear(),
  tab:'panel',
  ctype:'M',
  cper:null,
  q_cli:'',
  q_ctrl:'',
  q_anual:'',
  fgr:'todos'
};

function getOblList(){
  const custom = Object.values(S.catObl||{});
  return custom.length > 0 ? custom : DEFAULT_OBL;
}

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
const pad=n=>String(n).padStart(2,'0');
const money=n=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(n)||0);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const midnight=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clean=o=>JSON.parse(JSON.stringify(o));
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const fmtD=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
function toast(msg){const t=document.createElement('div');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3200)}

function ptype(k){return /^\d{4}-\d\d$/.test(k)?'M':/^\d{4}-S\d$/.test(k)?'S':'A'}
function plabel(k){
  const t=ptype(k);
  if(t==='M'){const [y,m]=k.split('-');return MESES[+m-1][0].toUpperCase()+MESES[+m-1].slice(1)+' '+y}
  if(t==='S'){const [y,s]=k.split('-');return (s==='S1'?'1.er semestre ':'2.º semestre ')+y}
  return 'Año '+k;
}
function monthKey(y,m){return y+'-'+pad(m)}

// Genera opciones desde 2026 hacia adelante únicamente
function periodOptions(t){
  const y=now.getFullYear(),m=now.getMonth()+1,out=[];
  if(t==='M'){
    for(let yy=y; yy>=2026; yy--){
      let maxM = (yy===y)? m+3 : 12;
      for(let mm=maxM; mm>=1; mm--) out.push(monthKey(yy,mm));
    }
  }
  if(t==='S'){
    for(let yy=y+1; yy>=2026; yy--){ out.push(yy+'-S2'); out.push(yy+'-S1'); }
  }
  if(t==='A'){
    for(let yy=y+1; yy>=2026; yy--) out.push(String(yy));
  }
  return out.length ? out : [t==='M'?'2026-01':t==='S'?'2026-S1':'2026'];
}

function defaultPeriod(t){
  const y=now.getFullYear(),m=now.getMonth()+1;
  if(y < 2026) return t==='M'?'2026-01':t==='S'?'2026-S1':'2026';
  if(t==='M'){return m===1?monthKey(y-1,12):monthKey(y,m-1)}
  if(t==='S'){return m>=7?y+'-S1':(y-1)+'-S2'}
  return String(y-1);
}

function digito9(ruc){return +String(ruc||'').replace(/\D/g,'')[8]}

function dueDate(c, k, oblKey) {
  const digito = digito9(c.ruc);
  const diaRuc = DIA_POR_DIGITO[digito] || 28;
  const t = ptype(k);

  if (t === 'M') {
    const [y, m] = k.split('-').map(Number);
    return new Date(y, m, diaRuc);
  }
  if (t === 'S') {
    const [y, s] = k.split('-S');
    return s === '1' ? new Date(+y, 6, diaRuc) : new Date(+y + 1, 0, diaRuc);
  }
  if (t === 'A') {
    const y = +k;
    const target = getOblList().find(o => o.k === oblKey);
    let mesIndex = 2;
    let diaEspecifico = diaRuc;

    if (target) {
      mesIndex = (target.m && target.m >= 1) ? target.m - 1 : 2;
      if (target.d !== 'RUC' && Number(target.d) > 0) diaEspecifico = Number(target.d);
    }
    if (oblKey === 'IM_RTA') mesIndex = c.tipo === 'SOCIEDAD' ? 3 : 2;
    else if (oblKey === 'PM') mesIndex = (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 5 : 6;

    return new Date(y + 1, mesIndex, diaEspecifico);
  }
  return new Date();
}

function oblMonthIndex(c, oblKey) {
  if (oblKey === 'IM_RTA') return c.tipo === 'SOCIEDAD' ? 4 : 3;
  if (oblKey === 'PM') return (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 6 : 7;
  const target = getOblList().find(o => o.k === oblKey);
  return target && target.m ? target.m : 3;
}

function daysTo(d){return Math.round((d-midnight())/864e5)}

const matchesQ=(c, qTerm)=>{
  if(!qTerm) return true;
  const q=qTerm.toLowerCase().trim();
  return (c.nombre||'').toLowerCase().includes(q)||(c.ruc||'').includes(q)||(c.grupo||'').toLowerCase().includes(q);
};

const clientesList=()=>Object.entries(S.clientes).map(([id,c])=>({...c,id})).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
const gruposList=()=>[...new Set(clientesList().map(c=>(c.grupo||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const tagsCli=c=>(c.activo===false?`<span class="chip warn">⏸ Suspendido</span> `:'')+(c.grupo?`<span class="chip info">🏢 ${esc(c.grupo)}</span> `:'')+(c.cobra===false?`<span class="chip mut">Gratuito</span> `:`<span class="chip ok">$${c.tarifa||0}</span> `)+(c.doc==='factura'?`<span class="chip info">Factura</span>`:`<span class="chip mut">Recibo</span>`);
const inGrp=c=>UI.fgr==='todos'||(UI.fgr==='__sin'?!(c.grupo||'').trim():(c.grupo||'').trim()===UI.fgr);
const grpSelect=()=>`<select data-f="fgr"><option value="todos">Todos los grupos</option><option value="__sin" ${UI.fgr==='__sin'?'selected':''}>Sin grupo</option>${gruposList().map(g=>`<option value="${esc(g)}" ${UI.fgr===g?'selected':''}>🏢 ${esc(g)}</option>`).join('')}</select>`;

const searchInput=(fieldKey, valStr)=>`<input type="text" id="src_${fieldKey}" placeholder="🔍 Buscar cliente o RUC…" value="${esc(valStr)}" data-f="${fieldKey}" style="min-width:200px">`;

const activos=()=>clientesList().filter(c=>c.activo!==false);
const cobrosList=()=>Object.entries(S.cobros).map(([id,c])=>({...c,id}));
function desdeOf(c){return c.desde||'2026-01'}

function aplica(c,k){
  const d=desdeOf(c),t=ptype(k);
  if(k < '2026') return false; // Bloquea datos anteriores al 2026
  if(t==='M')return k>=d;
  if(t==='S'){const [y,s]=k.split('-S');return y+'-'+(s==='1'?'06':'12')>=d}
  return k+'-12'>=d;
}

function oblFor(c,t){
  return getOblList().filter(o=>{
    if(!c.obl||c.obl[o.k]===false)return false;
    if(o.k==='SUPERCIAS'&&c.tipo!=='SOCIEDAD')return false;
    // Asignación de frecuencia basada en la obligación
    return o.f==='P' ? true : o.f===t;
  });
}

function avanceOf(cid,k){return S.avances[cid+'__'+k]||{done:{}}}

function rowsFor(t,k){
  if(k < '2026') return [];
  return activos().map(c=>{
    if(!aplica(c,k))return null;
    const items=oblFor(c,t);if(!items.length)return null;
    const av=avanceOf(c.id,k),done=items.filter(o=>av.done&&av.done[o.k]).length;
    const dues=items.map(o=>dueDate(c,k,o.k));
    const minDue=new Date(Math.min(...dues));
    const dd=daysTo(minDue);
    return {c,items,av,done,total:items.length,due:minDue,dd,complete:done===items.length,overdue:dd<0&&done<items.length};
  }).filter(Boolean);
}

function cobroCalc(x){
  const pagado=(x.abonos||[]).reduce((s,a)=>s+(+a.m||0),0),monto=+x.monto||0,saldo=Math.max(0,+(monto-pagado).toFixed(2));
  let est=x.anulado?'anulado':pagado>=monto&&monto>0?'pagado':pagado>0?'parcial':'pendiente';
  return {pagado,saldo,est};
}
const estChip=e=>({pagado:'<span class="chip ok">Pagado</span>',parcial:'<span class="chip warn">Abono parcial</span>',pendiente:'<span class="chip bad">Pendiente</span>',anulado:'<span class="chip mut">Anulado</span>'}[e]);

/* ============ BASE DE DATOS ============ */
const COLS=['clientes','cobros','avances','config','boveda','catObl'];
const Store={
  db:null,
  async init(){
    let db=null;
    try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
    if(db){
      this.db=db;S.kind='nube';
      COLS.forEach(col=>{
        db.collection(col).onSnapshot(snap=>{
          const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
          S[col]=o;loaded[col]=true;
          if(COLS.every(c=>loaded[c]))S.ready=true;
          render();
        },err=>{loaded[col]=true;if(COLS.every(c=>loaded[c]))S.ready=true;render()});
      });
      setTimeout(()=>{if(!S.ready){S.ready=true;render()}},6000);
    }else{
      S.kind='local';
      try{const raw=localStorage.getItem('bitacora_v1');if(raw){const d=JSON.parse(raw);COLS.forEach(c=>{S[c]=d[c]||{}})}}catch(e){}
      S.ready=true;render();
    }
  },
  saveLocal(){try{localStorage.setItem('bitacora_v1',JSON.stringify(Object.fromEntries(COLS.map(c=>[c,S[c]]))))}catch(e){}},
  async put(col,id,data){
    data=clean(data);S[col][id]=data;render();
    if(this.db){try{await this.db.doc(col+'/'+id).set(data)}catch(e){toast('Error al guardar')}}
    else this.saveLocal();
  },
  async del(col,id){
    delete S[col][id];render();
    if(this.db){try{await this.db.doc(col+'/'+id).delete()}catch(e){toast('Error al eliminar')}}
    else this.saveLocal();
  }
};

/* ============ CIFRADO BÓVEDA Y GESTOR DE CLAVES ============ */
const VAULT={key:null,data:[]};
const _enc=new TextEncoder(),_dec=new TextDecoder();
const b64=buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',_enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encJSON(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decJSON(key,d){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(d.ct));
  return JSON.parse(_dec.decode(pt));
}

async function loadVaultItems(){
  if(!VAULT.key||!S.boveda.items) { VAULT.data = []; return; }
  try {
    VAULT.data = await decJSON(VAULT.key, S.boveda.items);
  } catch(e) { VAULT.data = []; }
}

async function saveVaultItems(){
  if(!VAULT.key) return;
  const enc = await encJSON(VAULT.key, VAULT.data);
  await Store.put('boveda', 'items', enc);
}

function dueChip(r){
  if(r.complete)return '<span class="chip ok">Completo</span>';
  if(r.dd<0)return `<span class="chip bad">Vencido hace ${-r.dd} d · ${fmtD(r.due)}</span>`;
  return `<span class="chip ${r.dd<=7?'warn':'info'}">Vence en ${r.dd} d · ${fmtD(r.due)}</span>`;
}

function cellInfoAnual(c, y, mNum) {
  const mKey = monthKey(y, mNum);
  if (!aplica(c, mKey)) return { s: 'na' };

  const mItems = oblFor(c, 'M');
  const mAv = avanceOf(c.id, mKey);

  const aItemsInMonth = oblFor(c, 'A').filter(o => oblMonthIndex(c, o.k) === mNum);
  const aAv = avanceOf(c.id, String(y));

  let totalItems = mItems.length + aItemsInMonth.length;
  if (totalItems === 0) return { s: 'na' };

  let doneCount = 0, hasOverdue = false, minDays = 999;

  mItems.forEach(o => {
    if (mAv.done && mAv.done[o.k]) doneCount++;
    else {
      const dd = daysTo(dueDate(c, mKey, o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  aItemsInMonth.forEach(o => {
    if (aAv.done && aAv.done[o.k]) doneCount++;
    else {
      const dd = daysTo(dueDate(c, String(y), o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  let status = 'pend';
  if (doneCount === totalItems) status = 'ok';
  else if (hasOverdue) status = 'bad';
  else if (doneCount > 0) status = 'part';

  return { s: status, done: doneCount, total: totalItems, dd: minDays };
}

function vAnual(){
  const y = UI.ay < 2026 ? 2026 : UI.ay;
  let rows=activos().filter(c=>inGrp(c)&&matchesQ(c, UI.q_anual)).map(c=>{
    const cells=[];
    for(let m=1;m<=12;m++) cells.push(cellInfoAnual(c,y,m));
    const act=cells.filter(x=>x.s!=='na');
    return {c,cells,tot:act.length,ok:act.filter(x=>x.s==='ok').length,bad:act.filter(x=>x.s==='bad').length,pend:act.filter(x=>x.s!=='ok'&&x.s!=='na').length};
  }).filter(r=>r.tot>0);

  return `
  <div class="bar">
    <button class="btn" data-a="ayShift" data-dir="-1" ${y<=2026?'disabled':''}>◀</button>
    <b>Año ${y}</b>
    <button class="btn" data-a="ayShift" data-dir="1">▶</button>

    <div class="sm" style="margin-bottom:8px"><span class="cl ok">✓</span> cumplido · <span class="cl bad">vencido</span> · <span class="cl pend">·</span> pendiente.</div>
    ${rows.length?`<div class="tablewrap"><table class="ym" style="min-width:1000px">
      <thead><tr><th>Cliente</th>${MESES.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}<th>Estado</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><div class="nm">${esc(r.c.nombre)}</div></td>
        ${r.cells.map((x,idx)=>{
          if(x.s==='na')return '<td><span class="cl na">–</span></td>';

  const o = key ? (list.find(x => x.k === key) || {k:key, n:'', f:'P', m:0, d:'RUC'}) : {k:'', n:'', f:'P', m:0, d:'RUC'};

  openModal(`<h2>${key ? 'Editar Obligación' : 'Nueva Obligación'}</h2>
  <div class="fgrid">
    <div><label>Código / Clave<input id="mo_k" value="${esc(o.k)}" ${key?'readonly style="background:var(--bg)"':''}></label></div>
    <div><label>Nombre<input id="mo_n" value="${esc(o.n)}"></label></div>
    <div><label>Frecuencia<select id="mo_f">
      <option value="P" ${o.f==='P'?'selected':''}>Mensual</option>
      <option value="S" ${o.f==='S'?'selected':''}>Semestral</option>
      <option value="A" ${o.f==='A'?'selected':''}>Anual</option>
    </select></label></div>
    <div><label>Mes de Vencimiento (Anuales)<select id="mo_m">
      <option value="0">Según período</option>
      ${MESES.map((m,idx) => `<option value="${idx+1}" ${o.m===(idx+1)?'selected':''}>${m}</option>`).join('')}
    </select></label></div>
    <div class="full"><label>Día de Vencimiento<select id="mo_d">
      <option value="RUC" ${o.d==='RUC'?'selected':''}>Según 9.º dígito del RUC</option>
      ${[...Array(31)].map((_,i) => `<option value="${i+1}" ${String(o.d)===String(i+1)?'selected':''}>Día ${i+1}</option>`).join('')}
    </select></label></div>
  </div>
  <div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveObl" data-orig="${key||''}">Guardar Obligación</button></div>`);
}

function modalClave(){
  const clis = clientesList();
  openModal(`<h2>Nueva Credencial Cifrada</h2>
  <div class="fgrid">
    <div class="full">
      <label>Cliente registrado<select id="vk_cli_sel">
        <option value="">-- Seleccionar cliente --</option>
        ${clis.map(c => `<option value="${esc(c.nombre)}">${esc(c.nombre)} (${esc(c.ruc)})</option>`).join('')}
      </select></label>
    </div>
    <div class="full"><label>O ingresa el nombre directamente<input id="vk_cli_txt" placeholder="Si no está en la lista de clientes"></label></div>
    <div>
      <label>Servicio / Plataforma<select id="vk_srv_sel" onchange="if(this.value==='OTRO'){$('#vk_srv_txt').style.display='block'}else{$('#vk_srv_txt').style.display='none'}">
        <option value="SRI">SRI (Clave / RUC)</option>
        <option value="IESS">IESS (Patronal / Afiliado)</option>
        <option value="Supercias">Superintendencia de Compañías</option>
        <option value="Patente Municipal">Municipio / Patente</option>
        <option value="Correo electrónico">Correo electrónico</option>
        <option value="Firma Electrónica">Firma Electrónica (Pin)</option>
        <option value="OTRO">Otro servicio personalizado</option>
      </select></label>
    </div>
    <div><input id="vk_srv_txt" placeholder="Escribe el nombre del servicio" style="display:none;margin-top:18px"></div>
    <div class="full"><label>Usuario / RUC / Cédula<input id="vk_usr"></label></div>
    <div class="full"><label>Contraseña / Pin<input id="vk_pwd" type="text"></label></div>
  </div>
  <div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveClave">Guardar Cifrado</button></div>`);
}

/* MODAL DE REGISTRO DE COBRO MULTI-PERÍODO Y ACUMULADO */
function modalCobro(cid, conceptoDef, montoDef){
  const clis=activos();
  const targetCli = cid ? S.clientes[cid] : null;
  const autoMonto = montoDef || (targetCli ? targetCli.tarifa : '');

  openModal(`<h2>Registrar Cobro / Recibo</h2>
  <div class="fgrid">
    <div class="full"><label>Cliente<select id="mc_cli" onchange="ACT.updateMultiCobro(this.value)">
      <option value="">-- Seleccionar cliente --</option>
      ${clis.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.nombre)}</option>`).join('')}
    </select></label></div>
    
    <div class="full" id="mc_multi_container">
      <label>Concepto / Detalle de Servicios Acumulados:<input id="mc_con" value="${esc(conceptoDef||'Honorarios profesionales')}"></label>
    </div>

    <div><label>Monto Total A Cobrar ($)<input id="mc_mon" type="number" step="0.01" value="${autoMonto||''}"></label></div>
    <div><label>Monto Cobrado Hoy ($)<input id="mc_pag" type="number" step="0.01" value="${autoMonto||''}"></label></div>
    <div><label>Fecha de Emisión<input id="mc_fec" type="date" value="${todayStr()}"></label></div>
    <div><label>Fecha de Cobro / Abono<input id="mc_fec_pago" type="date" value="${todayStr()}"></label></div>
  </div>
  <div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveCobro">Guardar Registro de Cobro</button></div>`);
}

function modalAbono(id){
  const x = S.cobros[id]; if(!x) return;
  const c = S.clientes[x.clienteId]||{nombre:'Cliente'};
  const calc = cobroCalc(x);

  openModal(`<h2>Abonar a Cobro Pending</h2>
  <p><b>Cliente:</b> ${esc(c.nombre)}<br><b>Concepto:</b> ${esc(x.concepto)}<br><b>Saldo Pendiente:</b> <span style="color:var(--bad)">${money(calc.saldo)}</span></p>
  <div class="fgrid">
    <div><label>Monto del Abono ($)<input id="ma_monto" type="number" step="0.01" value="${calc.saldo}"></label></div>
    <div><label>Fecha del Abono<input id="ma_fec" type="date" value="${todayStr()}"></label></div>
  </div>
  <div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveAbono" data-id="${id}">Registrar Abono</button></div>`);
}

function modalAnDist(cid, y, mNum){
  const c = S.clientes[cid];
  const mKey = monthKey(y, mNum);
  const mItems = oblFor(c, 'M');
  const mAv = avanceOf(cid, mKey);
  const aItemsInMonth = oblFor(c, 'A').filter(o => oblMonthIndex(c, o.k) === mNum);
  const aAv = avanceOf(cid, String(y));

  openModal(`<h2>${esc(c.nombre)} · ${MESES[mNum-1]} ${y}</h2>
  ${mItems.length?`<b>Mensuales (${mKey}):</b><div class="obs" style="margin:6px 0 12px">${mItems.map(o=>`<button class="ob ${mAv.done&&mAv.done[o.k]?'done':''}" data-a="toggle" data-c="${cid}" data-k="${mKey}" data-m="${mNum}" data-o="${o.k}">${o.n}</button>`).join('')}</div>`:''}
  ${aItemsInMonth.length?`<b>Anuales (${y}):</b><div class="obs" style="margin:6px 0 12px">${aItemsInMonth.map(o=>`<button class="ob ${aAv.done&&aAv.done[o.k]?'done':''}" data-a="toggle" data-c="${cid}" data-k="${y}" data-m="${mNum}" data-o="${o.k}">${o.n}</button>`).join('')}</div>`:''}
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
  <div style="display:flex;justify-content:space-between;align-items:center">
    ${c.cobra !== false ? `<button class="btn sm pri" data-a="crearCobroDesdeModal" data-c="${cid}" data-m="${MESES[mNum-1]}${y}">+ Registrar cobro/honorario</button>` : '<span></span>'}
    <button class="btn" data-a="close">Listo</button>
  </div>`);
}

/* IMPRESIÓN DE RECIBO */
function imprimirReciboCobro(id){
  const x = S.cobros[id]; if(!x) return;
  const c = S.clientes[x.clienteId] || {nombre:'Cliente General', ruc:'N/A'};
  const calc = cobroCalc(x);
  const ultAbono = x.abonos && x.abonos.length ? x.abonos[x.abonos.length-1].f : x.fechaEmision;

  const html = `
    <div style="border:2px solid #000;padding:25px;max-width:650px;margin:0 auto;border-radius:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px">
        <div>
          <h2 style="margin:0;font-size:22px">COMPROBANTE / RECIBO DE COBRO</h2>
          <div style="font-size:13px;color:#555">Servicios Contables y Tributarios</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:14px;font-weight:bold">RECIBO N.° ${id.slice(-6).toUpperCase()}</div>
          <div style="font-size:13px">Fecha: ${fmtDate(ultAbono)}</div>
        </div>
      </div>
      
      <table style="width:100%;margin-bottom:15px;font-size:14px;border:none">
        <tr><td><strong>RECIBIDO DE:</strong> ${esc(c.nombre)}</td><td><strong>RUC/C.I.:</strong> ${esc(c.ruc)}</td></tr>
        <tr><td colspan="2" style="padding-top:8px"><strong>CONCEPTO:</strong> ${esc(x.concepto)}</td></tr>
      </table>

      <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px">
        <thead>
          <tr style="background:#eee">
            <th style="border:1px solid #000;padding:6px;text-align:left">Detalle / Período</th>
            <th style="border:1px solid #000;padding:6px;text-align:right">Monto Total</th>
            <th style="border:1px solid #000;padding:6px;text-align:right">Pagado</th>
            <th style="border:1px solid #000;padding:6px;text-align:right">Saldo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="border:1px solid #000;padding:8px">${esc(x.concepto)}</td>
            <td style="border:1px solid #000;padding:8px;text-align:right">${money(x.monto)}</td>
            <td style="border:1px solid #000;padding:8px;text-align:right">${money(calc.pagado)}</td>
            <td style="border:1px solid #000;padding:8px;text-align:right">${money(calc.saldo)}</td>
          </tr>
        </tbody>
      </table>

      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px">
        <div style="text-align:center;width:200px;border-top:1px solid #000;padding-top:5px;font-size:12px">Entregué Conforme</div>
        <div style="text-align:center;width:200px;border-top:1px solid #000;padding-top:5px;font-size:12px">Recibí Conforme</div>
      </div>
    </div>
  `;

  $('#print-area').innerHTML = html;
  window.print();
}

/* ============ MANEJO DE EVENTOS ============ */
const ACT={
  tab:d=>{UI.tab=d.k;render()},
  ctype:d=>{UI.ctype=d.k;UI.cper=defaultPeriod(d.k);render()},
  ayShift:d=>{UI.ay+=+d.dir;render()},
  loginGate:()=>{
    const p=val('g_pass_input');
    if(p===gateCfg()){ GATE.logged=true; render(); }
    else toast('Contraseña incorrecta');
  },
  lockApp:()=>{ GATE.logged=false; render(); toast('Sesión cerrada'); },
  saveGatePass:()=>{
    const p=val('set_gate_pass').trim();
    if(p){ localStorage.setItem('bitacora_gate_pass',p); toast('Clave guardada'); }
    else { localStorage.removeItem('bitacora_gate_pass'); toast('Clave removida'); }
    GATE.logged=true; render();
  },
  removeGatePass:()=>{ localStorage.removeItem('bitacora_gate_pass'); toast('Clave removida'); GATE.logged=true; render(); },
  nuevaObl:()=>modalObl(null),
  editObl:d=>modalObl(d.k),
  saveObl:async d=>{
    const k=val('mo_k').trim().toUpperCase(), n=val('mo_n').trim(), f=val('mo_f'), m=+val('mo_m'), dVal=val('mo_d');
    if(!k||!n){toast('Ingresa código y nombre');return}
    
    if(Object.keys(S.catObl).length===0){
      DEFAULT_OBL.forEach(o=>{ S.catObl[o.k]=o; });
    }
    
    const item = {k, n, f, m, d: dVal==='RUC'?'RUC':+dVal};
    await Store.put('catObl', k, item);
    closeModal(); toast('Obligación guardada');
  },
  delObl:async d=>{
    if(Object.keys(S.catObl).length===0){
      DEFAULT_OBL.forEach(o=>{ S.catObl[o.k]=o; });
    }
    await Store.del('catObl', d.k);
    toast('Obligación eliminada');
  },
  toggle:async d=>{
    const id=d.c+'__'+d.k, av=clean(avanceOf(d.c,d.k)); av.clienteId=d.c; av.periodo=d.k; av.done=av.done||{};
    if(av.done[d.o]) delete av.done[d.o]; else av.done[d.o]=true;
    await Store.put('avances',id,av);
    if($('#modal').firstChild){
      const mExact = d.m ? Number(d.m) : (d.k.includes('-') ? Number(d.k.split('-')[1]) : 1);
      modalAnDist(d.c, UI.ay, mExact);
    }
  },
  nuevoCobro:()=>modalCobro(null, '', ''),
  crearCobroDesdeModal:d=>modalCobro(d.c, 'Honorarios / Declaración '+d.m, ''),
  updateMultiCobro:(cid)=>{
    const c = S.clientes[cid];
    if(c && c.tarifa){
      $('#mc_mon').value = c.tarifa;
      $('#mc_pag').value = c.tarifa;
    }
  },
  saveCobro:async()=>{
    const clienteId=val('mc_cli'), concepto=val('mc_con').trim(), monto=+val('mc_mon'), pagado=+val('mc_pag'), fechaEmision=val('mc_fec'), fechaPago=val('mc_fec_pago');
    if(!clienteId||!concepto||!monto){toast('Completa cliente, concepto y monto');return}
    const id='cb_'+uid();
    const abonos = pagado > 0 ? [{f:fechaPago||fechaEmision, m:pagado}] : [];
    await Store.put('cobros',id,{id,clienteId,concepto,monto,fechaEmision,abonos});
    closeModal(); toast('Cobro registrado');
  },
  abonarCobro:d=>modalAbono(d.id),
  saveAbono:async d=>{
    const monto = +val('ma_monto'), fec = val('ma_fec');
    if(!monto||!fec){toast('Ingresa monto y fecha');return}
    const x = clean(S.cobros[d.id]);
    x.abonos = x.abonos || [];
    x.abonos.push({f:fec, m:monto});
    await Store.put('cobros', d.id, x);
    closeModal(); toast('Abono registrado');
  },
  imprimirRecibo:d=>imprimirReciboCobro(d.id),
  vSetup:async()=>{
    const p=val('v_pass');
    if(!p||p.length<6){toast('Clave mínima de 6 caracteres');return}
    const salt=crypto.getRandomValues(new Uint8Array(16)),iter=100000,key=await deriveKey(p,salt,iter);
    await Store.put('boveda','meta',{salt:b64(salt),iter,check:await encJSON(key,{ok:'BITACORA'})});
    VAULT.key=key; render(); toast('Bóveda configurada');
  },
  vUnlock:async()=>{
    const p=val('v_pass'),m=S.boveda.meta;
    try{
      const key=await deriveKey(p,unb64(m.salt),m.iter);
      const ck=await decJSON(key,m.check);if(ck.ok!=='BITACORA')throw 0;
      VAULT.key=key; await loadVaultItems(); render(); toast('Bóveda abierta');
    }catch(e){toast('Clave incorrecta')}
  },
  vLock:()=>{VAULT.key=null; VAULT.data=[]; render(); toast('Bóveda cerrada')},
  nuevaClave:()=>modalClave(),
  saveClave:async()=>{
    const cliSel=val('vk_cli_sel'), cliTxt=val('vk_cli_txt').trim();
    const cli = cliSel || cliTxt;

    let srv = val('vk_srv_sel');
    if(srv==='OTRO') srv = val('vk_srv_txt').trim();

    const usr=val('vk_usr').trim(), pwd=val('vk_pwd').trim();

    if(!cli||!usr||!pwd){toast('Selecciona cliente e ingresa usuario y clave');return}
    VAULT.data.push({cliente:cli,servicio:srv||'SRI',usuario:usr,clave:pwd});
    await saveVaultItems(); closeModal(); render(); toast('Credencial guardada');
  },
  delClave:async d=>{
    VAULT.data.splice(Number(d.i),1);
    await saveVaultItems(); render(); toast('Credencial eliminada');
  },
  showPass:d=>{
    const el=$('#vp_'+d.i);
    if(el) el.type = el.type==='password'?'text':'password';
  },
  nuevoCliente:()=>modalCliente(null),
  editCliente:d=>modalCliente(d.id),
  saveCliente:d=>{
    const nombre=val('m_nombre').trim(), ruc=val('m_ruc').trim();
    if(!nombre||!ruc){toast('Llena nombre y RUC');return}
    
    const oblMap = {};
    document.querySelectorAll('.chk-obl').forEach(chk => {
      oblMap[chk.dataset.k] = chk.checked;
    });

    const c={
      nombre,
      ruc,
      tipo:val('m_tipo'),
      grupo:val('m_grupo').trim(),
      cobra: val('m_cobra') === 'true',
      tarifa: +val('m_tarifa') || 0,
      cobroFreq: val('m_cobroFreq'),
      doc: val('m_doc'),
      activo: true,
      obl: oblMap
    };

    Store.put('clientes', d.id || ('c' + ruc), c);
    closeModal();
    toast('Cliente guardado');
  },
  anCellDist:d=>modalAnDist(d.c, +d.y, +d.m),
  close:()=>closeModal(),
  bgclose:(d,e)=>{if(e.target.classList.contains('bg'))closeModal()}
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const fn=ACT[b.dataset.a];if(fn)fn(b.dataset,e);
});

document.addEventListener('input',e=>{
  const t=e.target, f=t.dataset&&t.dataset.f;
  if(!f) return;

  if(f==='q_cli' || f==='q_ctrl' || f==='q_anual'){
    UI[f] = t.value;
    const currentPos = t.selectionStart;

    if(UI.tab==='clientes') $('#main').innerHTML = vClientes();
    else if(UI.tab==='control') $('#main').innerHTML = vControl();
    else if(UI.tab==='anual') $('#main').innerHTML = vAnual();

    const inputRef = $('#src_' + f);
    if(inputRef){
      inputRef.focus();
      inputRef.setSelectionRange(currentPos, currentPos);
    }
  }
});

document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='cper'){UI.cper=t.value;render()}
  else if(f==='fgr'){UI.fgr=t.value;render()}
});

UI.cper=defaultPeriod('M');
Store.init();
</script>
</body>
</html>
