<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de clientes y cobros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f8;--card:#ffffff;--ink:#1b2733;--mut:#66758a;--line:#dde3ea;
  --pri:#0f6b6b;--pri-ink:#ffffff;--pri-soft:#dff1f0;
  --ok:#1a7f4b;--ok-soft:#dcf3e6;--warn:#9a6700;--warn-soft:#fff1cc;--bad:#b42318;--bad-soft:#fde4e1;--info:#2452a4;--info-soft:#e3ebfb;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
    --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
    --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
  --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
  --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:20px;margin:0;flex:1 1 auto}
header.top .sub{color:var(--mut);font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi.bad .n{color:var(--bad)}.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{width:100%;min-height:60px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--pri)}
button.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.btn.sm{padding:4px 9px;font-size:13px}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.nm{font-weight:600}.sm{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mut{background:var(--line);color:var(--mut)}
.obs{display:flex;flex-wrap:wrap;gap:5px}
.ob{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.ob.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.ob.done::before{content:"✓ "}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.banner{background:var(--info-soft);color:var(--info);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1 1 240px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
#modal .bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto}
#modal .box.wide{max-width:720px}
#modal h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.fgrid input,.fgrid select{width:100%;margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.checks input{width:auto;margin:0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2733;color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.receipt{background:#fff;color:#111;border:1px solid #ccd;border-radius:8px;padding:22px;font-family:Georgia,"Times New Roman",serif}
.receipt h3{margin:0;font-size:20px;letter-spacing:1px}
.receipt .rh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.receipt .big{font-size:22px;font-weight:700}
.receipt table{min-width:0;width:100%}
.receipt td,.receipt th{border-color:#ccc;color:#111;padding:6px 4px;font-size:14px}
.receipt th{color:#555}
.receipt .sig{display:flex;gap:30px;margin-top:46px}
.receipt .sig div{flex:1;border-top:1px solid #111;text-align:center;font-size:12px;padding-top:4px}
.lnk{color:var(--pri);cursor:pointer;background:none;border:0;padding:0;font:inherit;font-weight:600}
table.ym th,table.ym td{padding:5px 4px;text-align:center}
table.ym td:first-child,table.ym th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;max-width:230px}
.cl{display:inline-block;min-width:34px;padding:3px 4px;border-radius:7px;font-size:12px;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.cl.ok{background:var(--ok-soft);color:var(--ok)}.cl.bad{background:var(--bad-soft);color:var(--bad)}
.cl.part{background:var(--warn-soft);color:var(--warn)}.cl.pend{background:var(--line);color:var(--mut)}
.cl.na{background:none;color:var(--line);cursor:default}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.kpi .n{font-size:22px}}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;width:100%;border:0}
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>📒 Bitácora de clientes y cobros</h1>
    <span class="sub" id="stat"></span>
    <button class="btn sm" id="lockbtn" data-a="lockApp" style="display:none">🔒 Bloquear</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============ DATOS INICIALES Y CATÁLOGO POR DEFECTO ============ */
const SEED = []; 
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const DEFAULT_OBL=[
  {k:'F103_104',n:'F103 + F104',f:'P',m:0,d:'RUC'},
  {k:'F104_SEM',n:'F104 semestral',f:'S',m:0,d:'RUC'},
  {k:'ATS',n:'ATS',f:'P',m:0,d:'RUC'},
  {k:'RDEP',n:'RDEP',f:'A',m:1,d:'RUC'}, // Enero
  {k:'AGP',n:'AGP',f:'A',m:2,d:'RUC'},  // Febrero
  {k:'APS',n:'APS',f:'A',m:2,d:'RUC'},  // Febrero
  {k:'IM_RTA',n:'Imp. Renta',f:'A',m:3,d:'RUC'}, // Marzo (PN) / Abril (Sociedades)
  {k:'SUPERCIAS',n:'Supercias',f:'A',m:4,d:30,soc:true}, // Abril fin de mes
  {k:'ADI',n:'ADI',f:'A',m:5,d:'RUC'}, // Mayo
  {k:'D_PATRIM',n:'D. Patrimonial',f:'A',m:5,d:'RUC'}, // Mayo
  {k:'PM',n:'Patente Municipal',f:'A',m:6,d:'RUC'}, // Junio (Obligados/Soc) / Julio (PN)
  {k:'S14',n:'14.º sueldo',f:'A',m:8,d:31}, // Agosto
  {k:'S13',n:'13.er sueldo',f:'A',m:12,d:24}  // Diciembre
];

const DIA_POR_DIGITO={1:10,2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,0:28};
const FORMAS=['Efectivo','Transferencia','Depósito','Cheque','Otro'];
const PERCODE={MENSUAL:'M',SEMESTRAL:'S',ANUAL:'A'};
const TIPOLBL={M:'Mensual',S:'Semestral',A:'Anual'};

/* ============ ESTADO ============ */
const S={boveda:{},clientes:{},cobros:{},avances:{},config:{},catObl:{},ready:false,kind:'…'};
const loaded={};
const now=new Date();
const UI={ay:new Date().getFullYear(),asolo:false,tab:'panel',ctype:'M',cper:null,q:'',solo:false,fest:'todos',fdoc:'todos',cq:'',clq:'',clver:'activos',cgrp:'todos',fgr:'todos',qgr:'',ord:{panel:'default',control:'venc',anual:'pend',cobros:'emision',clientes:'nombre',grupos:'nombre'}};
UI.cper=null;

/* ============ OBLIGACIONES DINÁMICAS ============ */
function getOblList(){
  const custom = Object.values(S.catObl||{});
  if(custom.length>0) return custom;
  return DEFAULT_OBL;
}

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const money=n=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(n)||0);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const midnight=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clean=o=>JSON.parse(JSON.stringify(o));
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const fmtD=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
function toast(msg){const t=document.createElement('div');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---- períodos ---- */
function ptype(k){return /^\d{4}-\d\d$/.test(k)?'M':/^\d{4}-S\d$/.test(k)?'S':'A'}
function plabel(k){
  const t=ptype(k);
  if(t==='M'){const [y,m]=k.split('-');return MESES[+m-1][0].toUpperCase()+MESES[+m-1].slice(1)+' '+y}
  if(t==='S'){const [y,s]=k.split('-');return (s==='S1'?'1.er semestre ':'2.º semestre ')+y}
  return 'Año '+k;
}
function monthKey(y,m){return y+'-'+pad(m)}
function semOfMonth(y,m){return y+'-S'+(m<=6?1:2)}
function periodOptions(t){
  const y=now.getFullYear(),m=now.getMonth()+1,out=[];
  if(t==='M'){for(let i=-1;i<47;i++){let mm=m-i,yy=y;while(mm<1){mm+=12;yy--}out.push(monthKey(yy,mm))}}
  if(t==='S'){for(let yy=y+1;yy>=y-4;yy--){out.push(yy+'-S2');out.push(yy+'-S1')}}
  if(t==='A'){for(let yy=y+1;yy>=y-5;yy--)out.push(String(yy))}
  return out;
}
function defaultPeriod(t){
  const y=now.getFullYear(),m=now.getMonth()+1;
  if(t==='M'){return m===1?monthKey(y-1,12):monthKey(y,m-1)}
  if(t==='S'){return m>=7?y+'-S1':(y-1)+'-S2'}
  return String(y-1);
}
function digito9(ruc){return +String(ruc||'').replace(/\D/g,'')[8]}

/* ---- CÁLCULO DE VENCIMIENTOS REGULATORIOS ---- */
function dueDate(c, k, oblKey) {
  const digito = digito9(c.ruc);
  const diaRuc = DIA_POR_DIGITO[digito] || 28;
  const t = ptype(k);

  if (t === 'M') {
    const [y, m] = k.split('-').map(Number);
    return new Date(y, m, diaRuc);
  }

  if (t === 'S') {
    const [y, s] = k.split('-S');
    return s === '1' ? new Date(+y, 6, diaRuc) : new Date(+y + 1, 0, diaRuc);
  }

  if (t === 'A') {
    const y = +k;
    const OBL = getOblList();
    const target = OBL.find(o => o.k === oblKey);

    let mesIndex = 2; // Marzo por defecto (base 0)
    let diaEspecifico = diaRuc;

    if (target) {
      mesIndex = (target.m && target.m >= 1) ? target.m - 1 : 2;
      if (target.d !== 'RUC' && Number(target.d) > 0) {
        diaEspecifico = Number(target.d);
      }
    }

    // Reglas especiales SRI / Supercias / Patente
    if (oblKey === 'IM_RTA') {
      mesIndex = c.tipo === 'SOCIEDAD' ? 3 : 2; // Abril / Marzo
    } else if (oblKey === 'PM') {
      mesIndex = (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 5 : 6; // Junio / Julio
    }

    return new Date(y + 1, mesIndex, diaEspecifico);
  }

  return new Date();
}

function oblMonthIndex(c, oblKey) {
  if (oblKey === 'IM_RTA') return c.tipo === 'SOCIEDAD' ? 4 : 3;
  if (oblKey === 'PM') return (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 6 : 7;
  const target = getOblList().find(o => o.k === oblKey);
  return target && target.m ? target.m : 3;
}

function daysTo(d){return Math.round((d-midnight())/864e5)}

/* ---- cálculos ---- */
const clientesList=()=>Object.entries(S.clientes).map(([id,c])=>({...c,id})).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
const gruposList=()=>[...new Set(clientesList().map(c=>(c.grupo||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const refList=()=>[...new Set(clientesList().map(c=>(c.referidoPor||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const tagsCli=c=>(c.activo===false?`<span class="chip warn">⏸ Suspendido${c.suspFecha?' desde '+fmtDate(c.suspFecha):''}</span> `:'')+(c.grupo?`<span class="chip info" title="Grupo de empresas">🏢 ${esc(c.grupo)}</span> `:'')+(c.referidoPor?`<span class="chip mut" title="Referido por">🤝 ${esc(c.referidoPor)}</span>`:'');
const inGrp=c=>UI.fgr==='todos'||(UI.fgr==='__sin'?!(c.grupo||'').trim():(c.grupo||'').trim()===UI.fgr);
const grpSelect=()=>`<select data-f="fgr" title="Filtrar por grupo de empresas"><option value="todos">Todos los grupos</option><option value="__sin" ${UI.fgr==='__sin'?'selected':''}>Sin grupo</option>${gruposList().map(g=>`<option value="${esc(g)}" ${UI.fgr===g?'selected':''}>🏢 ${esc(g)}</option>`).join('')}</select>`;
const diaV=c=>DIA_POR_DIGITO[digito9(c.ruc)]||99;
const byNombre=(a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es');
const byDia=(a,b)=>diaV(a)-diaV(b)||byNombre(a,b);
const ordSel=(scr,extra=[])=>`<select data-f="ord" data-s="${scr}" title="Ordenar por">${[...extra,['venc','Ordenar: día de vencimiento'],['nombre','Ordenar: razón social']].map(([v,l])=>`<option value="${v}" ${UI.ord[scr]===v?'selected':''}>${l}</option>`).join('')}</select>`;
const eqMensual=c=>!c.cobra?0:(c.tarifa||0)/({M:1,S:6,A:12}[c.cobroFreq]||1);
const activos=()=>clientesList().filter(c=>c.activo!==false);
const cobrosList=()=>Object.entries(S.cobros).map(([id,c])=>({...c,id}));
function desdeOf(c){return c.desde||(now.getFullYear()+'-01')}
function aplica(c,k){
  const d=desdeOf(c),t=ptype(k);
  if(t==='M')return k>=d;
  if(t==='S'){const [y,s]=k.split('-S');return y+'-'+(s==='1'?'06':'12')>=d}
  return k+'-12'>=d;
}
function oblFor(c,t){
  return getOblList().filter(o=>{
    if(!c.obl||!c.obl[o.k])return false;
    if(o.k==='SUPERCIAS'&&c.tipo!=='SOCIEDAD')return false;
    return o.f==='P'?PERCODE[c.periodicidad]===t:o.f===t;
  });
}
function avanceOf(cid,k){return S.avances[cid+'__'+k]||{done:{}}}
function rowsFor(t,k){
  return activos().map(c=>{
    if(!aplica(c,k))return null;
    const items=oblFor(c,t);if(!items.length)return null;
    const av=avanceOf(c.id,k),done=items.filter(o=>av.done&&av.done[o.k]).length;
    const dues=items.map(o=>dueDate(c,k,o.k));
    const minDue=new Date(Math.min(...dues));
    const dd=daysTo(minDue);
    return {c,items,av,done,total:items.length,due:minDue,dd,complete:done===items.length,overdue:dd<0&&done<items.length};
  }).filter(Boolean);
}
function cobroCalc(x){
  const pagado=(x.abonos||[]).reduce((s,a)=>s+(+a.m||0),0),monto=+x.monto||0,saldo=Math.max(0,+(monto-pagado).toFixed(2));
  let est=x.anulado?'anulado':pagado>=monto&&monto>0?'pagado':pagado>0?'parcial':'pendiente';
  return {pagado,saldo,est};
}
function nextRecibo(){
  const y=now.getFullYear();let mx=0;
  cobrosList().forEach(x=>{const m=/^R-(\d{4})-(\d+)$/.exec(x.numDoc||'');if(m&&+m[1]===y)mx=Math.max(mx,+m[2])});
  return 'R-'+y+'-'+String(mx+1).padStart(4,'0');
}
function cobroDe(cid,k){return cobrosList().find(x=>x.clienteId===cid&&x.periodo===k&&!x.anulado)}
const estChip=e=>({pagado:'<span class="chip ok">Pagado</span>',parcial:'<span class="chip warn">Abono parcial</span>',pendiente:'<span class="chip bad">Pendiente</span>',anulado:'<span class="chip mut">Anulado</span>'}[e]);

/* ============ ALMACENAMIENTO ============ */
const COLS=['clientes','cobros','avances','config','boveda','catObl'];
const Store={
  db:null,
  async init(){
    let db=null;
    try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
    if(db){
      this.db=db;S.kind='nube';
      COLS.forEach(col=>{
        db.collection(col).onSnapshot(snap=>{
          const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
          S[col]=o;loaded[col]=true;
          if(COLS.every(c=>loaded[c]))S.ready=true;
          render();
        },err=>{loaded[col]=true;if(COLS.every(c=>loaded[c]))S.ready=true;render();toast('Sin acceso a la base de datos compartida')});
      });
      setTimeout(()=>{if(!S.ready){S.ready=true;render()}},6000);
    }else{
      S.kind='local';
      try{const raw=localStorage.getItem('bitacora_v1');if(raw){const d=JSON.parse(raw);COLS.forEach(c=>{S[c]=d[c]||{}})}}catch(e){}
      S.ready=true;render();
    }
  },
  saveLocal(){try{localStorage.setItem('bitacora_v1',JSON.stringify(Object.fromEntries(COLS.map(c=>[c,S[c]]))))}catch(e){}},
  async put(col,id,data){
    data=clean(data);S[col][id]=data;render();
    if(this.db){try{await this.db.doc(col+'/'+id).set(data)}catch(e){toast('No se pudo guardar');console.error(e)}}
    else this.saveLocal();
  },
  async del(col,id){
    delete S[col][id];render();
    if(this.db){try{await this.db.doc(col+'/'+id).delete()}catch(e){toast('No se pudo eliminar');console.error(e)}}
    else this.saveLocal();
  }
};

/* ---- RESUMEN ANUAL DISTRIBUIDO ---- */
function cellInfoAnual(c, y, mNum) {
  const mKey = monthKey(y, mNum);
  if (!aplica(c, mKey)) return { s: 'na' };

  // 1. Mensuales del mes
  const mItems = oblFor(c, 'M');
  const mAv = avanceOf(c.id, mKey);

  // 2. Anuales que corresponden a este mes específico
  const aItemsAll = oblFor(c, 'A');
  const aItemsInMonth = aItemsAll.filter(o => oblMonthIndex(c, o.k) === mNum);
  const aAv = avanceOf(c.id, String(y));

  let totalItems = mItems.length + aItemsInMonth.length;
  if (totalItems === 0) return { s: 'na' };

  let doneCount = 0;
  let hasOverdue = false;
  let minDays = 999;

  // Evaluar mensuales
  mItems.forEach(o => {
    if (mAv.done && mAv.done[o.k]) doneCount++;
    else {
      const dd = daysTo(dueDate(c, mKey, o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  // Evaluar anuales en su mes
  aItemsInMonth.forEach(o => {
    if (aAv.done && aAv.done[o.k]) doneCount++;
    else {
      const dd = daysTo(dueDate(c, String(y), o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  let status = 'pend';
  if (doneCount === totalItems) status = 'ok';
  else if (hasOverdue) status = 'bad';
  else if (doneCount > 0) status = 'part';

  return { s: status, done: doneCount, total: totalItems, dd: minDays, y, mNum };
}

function vGrupos(){
  const L=activos();
  const q=(UI.qgr||'').trim().toLowerCase();
  const grp={},ref={};
  L.forEach(c=>{
    const g=(c.grupo||'').trim(),r=(c.referidoPor||'').trim();
    if(g)(grp[g]=grp[g]||[]).push(c);
    if(r)(ref[r]=ref[r]||[]).push(c);
  });
  const sinG=L.filter(c=>!(c.grupo||'').trim()).length,sinR=L.filter(c=>!(c.referidoPor||'').trim()).length;
  const match=(name,arr)=>!q||(name+' '+arr.map(c=>c.nombre).join(' ')).toLowerCase().includes(q);
  const G=Object.entries(grp).filter(([n,a])=>match(n,a)).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'es'));
  const R=Object.entries(ref).filter(([n,a])=>match(n,a)).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'es'));
  const miembros=a=>a.sort(UI.ord.grupos==='venc'?byDia:byNombre).map(c=>`<div class="sm">• ${esc(c.nombre)}${c.cobra&&c.tarifa?' · '+money(c.tarifa)+' / '+({M:'mes',S:'semestre',A:'año'}[c.cobroFreq]||''):''}</div>`).join('');
  return `
  <div class="grid kpis">
    <div class="card kpi"><div class="n">${Object.keys(grp).length}</div><div class="l">Grupos de empresas</div></div>
    <div class="card kpi"><div class="n">${L.length-sinG}</div><div class="l">Clientes en algún grupo</div></div>
    <div class="card kpi"><div class="n">${Object.keys(ref).length}</div><div class="l">Personas que han referido</div></div>
    <div class="card kpi"><div class="n">${L.length-sinR}</div><div class="l">Clientes referidos</div></div>
  </div>
  <div class="bar"><input class="grow" type="search" placeholder="Buscar grupo, referidor o cliente…" value="${esc(UI.qgr)}" data-f="qgr" id="qgr">${ordSel('grupos')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
    <div class="card"><b>🏢 Grupos de empresas</b>
      <div class="sm" style="margin:2px 0 10px">${sinG} cliente(s) activo(s) sin grupo. Asigna el grupo en Clientes → Editar.</div>
      ${G.length?G.map(([n,a])=>`<div style="padding:10px 0;border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap">
          <span class="nm">${esc(n)} <span class="chip info">${a.length} cliente${a.length>1?'s':''}</span></span>
          <span><button class="lnk" data-a="verGrupo" data-g="${esc(n)}">Clientes →</button> · <button class="lnk" data-a="obGrupo" data-g="${esc(n)}">Obligaciones →</button></span></div>
        <div class="sm" style="margin:2px 0 4px">Honorarios ≈ ${money(a.reduce((t,c)=>t+eqMensual(c),0))} al mes</div>${miembros(a)}</div>`).join(''):'<div class="empty">Aún no hay grupos. Escribe un nombre de grupo al editar un cliente.</div>'}
    </div>
    <div class="card"><b>🤝 Referidos</b>
      <div class="sm" style="margin:2px 0 10px">${sinR} cliente(s) activo(s) sin referidor registrado.</div>
      ${R.length?R.map(([n,a])=>`<div style="padding:10px 0;border-top:1px solid var(--line)">
        <div class="nm">${esc(n)} <span class="chip ok">${a.length} referido${a.length>1?'s':''}</span></div>
        <div class="sm" style="margin:2px 0 4px">Honorarios de sus referidos ≈ ${money(a.reduce((t,c)=>t+eqMensual(c),0))} al mes</div>${miembros(a)}</div>`).join(''):'<div class="empty">Aún no hay referidos. Escribe “Referido por” al editar un cliente.</div>'}
    </div>
  </div>`;
}

function saveCliente(id){
  const ruc=val('m_ruc').replace(/\D/g,''),nombre=val('m_nombre').trim();
  if(!nombre||![10,13].includes(ruc.length)){toast('Completa el nombre y un RUC de 10 o 13 dígitos');return}
  const obl={};getOblList().forEach(o=>{obl[o.k]=chk('o_'+o.k)});
  const c={desde:val('m_desde'),nombre,ruc:ruc.length===10?ruc+'001':ruc,tipo:val('m_tipo'),regimen:val('m_reg'),periodicidad:val('m_per'),contabilidad:chk('m_cont'),
    activo:chk('m_act'),suspFecha:chk('m_act')?'':(((id&&S.clientes[id])||{}).suspFecha||todayStr()),obl,cobra:chk('m_cobra'),tarifa:+val('m_tarifa')||0,cobroFreq:val('m_freq'),doc:val('m_doc'),pagadoPor:val('m_paga').trim(),grupo:val('m_grupo').trim(),referidoPor:val('m_ref').trim(),notas:val('m_notas')};
  Store.put('clientes',id||('c'+c.ruc+(S.clientes['c'+c.ruc]?uid():'')),c);closeModal();toast('Cliente guardado');
}

/* ---- MODAL OBLIGACIÓN DINÁMICA ---- */
function modalObl(key){
  const OBL = getOblList();
  const o = key ? OBL.find(item => item.k === key) : { k: '', n: '', f: 'A', m: 1, d: 'RUC' };
  openModal(`<h2>${key ? 'Editar obligación' : 'Nueva obligación'}</h2>
  <div class="fgrid">
    <div><label>Código / Clave (ej: PM)<input id="o_key" value="${esc(o.k)}" ${key ? 'disabled' : ''}></label></div>
    <div><label>Nombre legible<input id="o_nom" value="${esc(o.n)}"></label></div>
    <div><label>Frecuencia<select id="o_freq">
      <option value="A" ${o.f === 'A' ? 'selected' : ''}>Anual</option>
      <option value="S" ${o.f === 'S' ? 'selected' : ''}>Semestral</option>
      <option value="P" ${o.f === 'P' ? 'selected' : ''}>Mensual (Periodicidad)</option>
    </select></label></div>
    <div><label>Mes de vencimiento (para Anuales)<select id="o_mes">
      ${MESES.map((m, idx) => `<option value="${idx + 1}" ${o.m === (idx + 1) ? 'selected' : ''}>${m}</option>`).join('')}
    </select></label></div>
    <div class="full"><label>Día de Vencimiento<input id="o_dia" value="${esc(o.d)}" placeholder="Escribe RUC o un número fijo (ej. 30)"></label></div>
  </div>
  <div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveObl" data-k="${key || ''}">Guardar</button></div>`);
}

function saveObl(key){
  const k = key || val('o_key').trim().toUpperCase();
  const n = val('o_nom').trim();
  if(!k || !n){ toast('Completa el código y el nombre'); return; }
  const item = {
    k, n,
    f: val('o_freq'),
    m: Number(val('o_mes')) || 1,
    d: val('o_dia').trim() === 'RUC' ? 'RUC' : (Number(val('o_dia')) || 'RUC')
  };
  Store.put('catObl', k, item);
  closeModal();
  toast('Obligación guardada');
}

function modalAnDist(cid, y, mNum){
  const c = S.clientes[cid];
  const mKey = monthKey(y, mNum);
  const mItems = oblFor(c, 'M');
  const mAv = avanceOf(cid, mKey);

  const aItemsInMonth = oblFor(c, 'A').filter(o => oblMonthIndex(c, o.k) === mNum);
  const aAv = avanceOf(cid, String(y));

  openModal(`<h2>${esc(c.nombre)} · ${MESES[mNum-1]} ${y}</h2>
  <div class="sm" style="margin-bottom:10px">Obligaciones mensuales y anuales de este mes:</div>
  
  ${mItems.length?`<b>Mensuales (${mKey}):</b><div class="obs" style="margin:6px 0 12px">${mItems.map(o=>`<button class="ob ${mAv.done&&mAv.done[o.k]?'done':''}" data-a="toggle" data-c="${cid}" data-k="${mKey}" data-o="${o.k}">${o.n}</button>`).join('')}</div>`:''}
  
  ${aItemsInMonth.length?`<b>Anuales (${y}):</b><div class="obs" style="margin:6px 0 12px">${aItemsInMonth.map(o=>`<button class="ob ${aAv.done&&aAv.done[o.k]?'done':''}" data-a="toggle" data-c="${cid}" data-k="${y}" data-o="${o.k}">${o.n}</button>`).join('')}</div>`:''}

  ${!mItems.length && !aItemsInMonth.length ? '<div class="empty">Sin obligaciones asignadas para este mes.</div>' : ''}

  <div class="actions"><button class="btn pri" data-a="close">Listo</button></div>`);
}

function periodSelect(idf,selected){
  const opts=[['Mensual',periodOptions('M')],['Semestral',periodOptions('S')],['Anual',periodOptions('A')]];
  const flat=opts.flatMap(o=>o[1]);if(selected&&!flat.includes(selected))opts.unshift(['Otro',[selected]]);
  return `<select id="${idf}">${opts.map(([g,a])=>`<optgroup label="${g}">${a.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${plabel(k)}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
