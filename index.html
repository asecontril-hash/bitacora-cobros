<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de clientes y cobros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f8;--card:#ffffff;--ink:#1b2733;--mut:#66758a;--line:#dde3ea;
  --pri:#0f6b6b;--pri-ink:#ffffff;--pri-soft:#dff1f0;
  --ok:#1a7f4b;--ok-soft:#dcf3e6;--warn:#9a6700;--warn-soft:#fff1cc;--bad:#b42318;--bad-soft:#fde4e1;--info:#2452a4;--info-soft:#e3ebfb;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
    --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
    --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
  --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
  --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:20px;margin:0;flex:1 1 auto}
header.top .sub{color:var(--mut);font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi.bad .n{color:var(--bad)}.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{width:100%;min-height:60px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--pri)}
button.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.btn.sm{padding:4px 9px;font-size:13px}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.nm{font-weight:600}.sm{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mut{background:var(--line);color:var(--mut)}
.obs{display:flex;flex-wrap:wrap;gap:5px}
.ob{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.ob.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.ob.done::before{content:"✓ "}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#modal .bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto}
#modal .box.wide{max-width:760px}
#modal h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.fgrid input,.fgrid select{width:100%;margin-top:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2733;color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
table.ym th,table.ym td{padding:5px 4px;text-align:center}
table.ym td:first-child,table.ym th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;max-width:230px}
.cl{display:inline-block;min-width:34px;padding:3px 4px;border-radius:7px;font-size:12px;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.cl.ok{background:var(--ok-soft);color:var(--ok)}.cl.bad{background:var(--bad-soft);color:var(--bad)}
.cl.part{background:var(--warn-soft);color:var(--warn)}.cl.pend{background:var(--line);color:var(--mut)}
.cl.na{background:none;color:var(--line);cursor:default}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:6px}
.ob-item{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.ob-item input{margin:0}
.sec-title{font-size:13px;font-weight:700;color:var(--pri);margin-top:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* Garantizar que la zona de impresión no ocupe pantalla */
#print-area { display: none; }
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; display: block !important; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; font-family: sans-serif; }
}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.kpi .n{font-size:22px}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>📒 Bitácora de clientes y cobros</h1>
    <span class="sub" id="stat"></span>
    <button class="btn sm danger" id="lockbtn" data-a="lockApp" style="display:none">🔒 Cerrar sesión</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

var DEFAULT_OBL=[
  {k:'F103_104',n:'F103 + F104',f:'P',m:0,d:'RUC'},
  {k:'F104_SEM',n:'F104 semestral',f:'S',m:0,d:'RUC'},
  {k:'ATS',n:'ATS',f:'P',m:0,d:'RUC'},
  {k:'RDEP',n:'RDEP',f:'A',m:1,d:'RUC'},
  {k:'AGP',n:'AGP',f:'A',m:2,d:'RUC'},
  {k:'APS',n:'APS',f:'A',m:2,d:'RUC'},
  {k:'IM_RTA',n:'Imp. Renta',f:'A',m:3,d:'RUC'},
  {k:'SUPERCIAS',n:'Supercias',f:'A',m:4,d:30},
  {k:'ADI',n:'ADI',f:'A',m:5,d:'RUC'},
  {k:'D_PATRIM',n:'D. Patrimonial',f:'A',m:5,d:'RUC'},
  {k:'PM',n:'Patente Municipal',f:'A',m:6,d:'RUC'},
  {k:'S14',n:'14.o sueldo',f:'A',m:8,d:31},
  {k:'S13',n:'13.er sueldo',f:'A',m:12,d:24}
];

var DIA_POR_DIGITO={1:10,2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,0:28};
var PERCODE={MENSUAL:'M',SEMESTRAL:'S',ANUAL:'A'};
var TIPOLBL={M:'Mensual',S:'Semestral',A:'Anual'};

var GATE={logged:false};
function gateCfg(){return localStorage.getItem('bitacora_gate_pass')||''}

var S={boveda:{},clientes:{},cobros:{},avances:{},config:{},catObl:{},ready:false,kind:'…'};
var loaded={};
var now=new Date();
var UI={
  ay:new Date().getFullYear(),
  tab:'panel',
  ctype:'M',
  cper:null,
  q_cli:'',
  q_ctrl:'',
  q_anual:'',
  fgr:'todos'
};

function getOblList(){
  var dict = {};
  DEFAULT_OBL.forEach(function(o){ dict[o.k] = Object.assign({}, o); });
  if(S.catObl){
    Object.keys(S.catObl).forEach(function(k){
      if(S.catObl[k]) dict[k] = S.catObl[k];
    });
  }
  return Object.values(dict);
}

function $(s){ return document.querySelector(s); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function money(n){ return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(n)||0); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function midnight(){ var d=new Date();d.setHours(0,0,0,0);return d; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(s){ if(!s)return''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtD(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function toast(msg){ var t=document.createElement('div');t.textContent=msg;$('#toast').appendChild(t);setTimeout(function(){t.remove();},3200); }

function ptype(k){ return /^\d{4}-\d\d$/.test(k)?'M':/^\d{4}-S\d$/.test(k)?'S':'A'; }
function plabel(k){
  var t=ptype(k);
  if(t==='M'){ var p=k.split('-'); return MESES[+p[1]-1][0].toUpperCase()+MESES[+p[1]-1].slice(1)+' '+p[0]; }
  if(t==='S'){ var p2=k.split('-'); return (p2[1]==='S1'?'1.er semestre ':'2.o semestre ')+p2[0]; }
  return 'Año '+k;
}
function monthKey(y,m){ return y+'-'+pad(m); }

function periodOptions(t){
  var y=now.getFullYear(),m=now.getMonth()+1,out=[];
  if(t==='M'){
    for(var yy=y; yy>=2026; yy--){
      var maxM = (yy===y)? m+3 : 12;
      for(var mm=maxM; mm>=1; mm--) out.push(monthKey(yy,mm));
    }
  }
  if(t==='S'){
    for(var yy2=y+1; yy2>=2026; yy2--){ out.push(yy2+'-S2'); out.push(yy2+'-S1'); }
  }
  if(t==='A'){
    for(var yy3=y+1; yy3>=2026; yy3--) out.push(String(yy3));
  }
  return out.length ? out : [t==='M'?'2026-01':t==='S'?'2026-S1':'2026'];
}

function defaultPeriod(t){
  var y=now.getFullYear(),m=now.getMonth()+1;
  if(y < 2026) return t==='M'?'2026-01':t==='S'?'2026-S1':'2026';
  if(t==='M'){ return m===1?monthKey(y-1,12):monthKey(y,m-1); }
  if(t==='S'){ return m>=7?y+'-S1':(y-1)+'-S2'; }
  return String(y-1);
}

function digito9(ruc){ return +String(ruc||'').replace(/\D/g,'')[8]; }

function dueDate(c, k, oblKey) {
  var digito = digito9(c.ruc);
  var diaRuc = DIA_POR_DIGITO[digito] || 28;
  var t = ptype(k);

  if (t === 'M') {
    var p = k.split('-').map(Number);
    return new Date(p[0], p[1], diaRuc);
  }
  if (t === 'S') {
    var p2 = k.split('-S');
    return p2[1] === '1' ? new Date(+p2[0], 6, diaRuc) : new Date(+p2[0] + 1, 0, diaRuc);
  }
  if (t === 'A') {
    var y = +k;
    var target = getOblList().find(function(o){ return o.k === oblKey; });
    var mesIndex = 2;
    var diaEspecifico = diaRuc;

    if (target) {
      mesIndex = (target.m && target.m >= 1) ? target.m - 1 : 2;
      if (target.d !== 'RUC' && Number(target.d) > 0) diaEspecifico = Number(target.d);
    }
    if (oblKey === 'IM_RTA') mesIndex = c.tipo === 'SOCIEDAD' ? 3 : 2;
    else if (oblKey === 'PM') mesIndex = (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 5 : 6;

    return new Date(y + 1, mesIndex, diaEspecifico);
  }
  return new Date();
}

function oblMonthIndex(c, oblKey) {
  if (oblKey === 'IM_RTA') return c.tipo === 'SOCIEDAD' ? 4 : 3;
  if (oblKey === 'PM') return (c.tipo === 'SOCIEDAD' || c.contabilidad) ? 6 : 7;
  var target = getOblList().find(function(o){ return o.k === oblKey; });
  return target && target.m ? target.m : 3;
}

function daysTo(d){ return Math.round((d-midnight())/864e5); }

function matchesQ(c, qTerm){
  if(!qTerm) return true;
  var q=qTerm.toLowerCase().trim();
  return (c.nombre||'').toLowerCase().includes(q)||(c.ruc||'').includes(q)||(c.grupo||'').toLowerCase().includes(q);
}

function clientesList(){
  return Object.entries(S.clientes).map(function(pair){ return Object.assign({}, pair[1], {id: pair[0]}); }).sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); });
}

function gruposList(){
  var set = new Set(clientesList().map(function(c){ return (c.grupo||'').trim(); }).filter(Boolean));
  return Array.from(set).sort(function(a,b){ return a.localeCompare(b,'es'); });
}

function tagsCli(c){
  return (c.activo===false?'<span class="chip warn">⏸ Suspendido</span> ':'')+
         (c.grupo?'<span class="chip info">🏢 '+esc(c.grupo)+'</span> ':'')+
         (c.cobra===false?'<span class="chip mut">Gratuito</span> ':'<span class="chip ok">$'+(c.tarifa||0)+'</span> ')+
         (c.doc==='factura'?'<span class="chip info">Factura</span>':'<span class="chip mut">Recibo</span>');
}

function inGrp(c){
  return UI.fgr==='todos'||(UI.fgr==='__sin'?!((c.grupo||'').trim()):(c.grupo||'').trim()===UI.fgr);
}

function grpSelect(){
  return '<select data-f="fgr"><option value="todos">Todos los grupos</option><option value="__sin" '+(UI.fgr==='__sin'?'selected':'')+'>Sin grupo</option>'+
         gruposList().map(function(g){ return '<option value="'+esc(g)+'" '+(UI.fgr===g?'selected':'')+'>🏢 '+esc(g)+'</option>'; }).join('')+'</select>';
}

function searchInput(fieldKey, valStr){
  return '<input type="text" id="src_'+fieldKey+'" placeholder="🔍 Buscar cliente o RUC…" value="'+esc(valStr)+'" data-f="'+fieldKey+'" style="min-width:200px">';
}

function activos(){ return clientesList().filter(function(c){ return c.activo!==false; }); }
function cobrosList(){ return Object.entries(S.cobros).map(function(pair){ return Object.assign({}, pair[1], {id: pair[0]}); }); }
function desdeOf(c){ return c.desde||'2026-01'; }

function aplica(c,k){
  var d=desdeOf(c),t=ptype(k);
  if(k < '2026') return false;
  if(t==='M') return k>=d;
  if(t==='S'){ var p=k.split('-S'); return p[0]+'-'+(p[1]==='1'?'06':'12')>=d; }
  return k+'-12'>=d;
}

function oblFor(c,t){
  return getOblList().filter(function(o){
    if(!c.obl||c.obl[o.k]===false)return false;
    if(o.k==='SUPERCIAS'&&c.tipo!=='SOCIEDAD')return false;
    return o.f==='P' ? true : o.f===t;
  });
}

function avanceOf(cid,k){ return S.avances[cid+'__'+k]||{done:{}}; }

function rowsFor(t,k){
  if(k < '2026') return [];
  return activos().map(function(c){
    if(!aplica(c,k))return null;
    var items=oblFor(c,t);if(!items.length)return null;
    var av=avanceOf(c.id,k);
    var done=items.filter(function(o){ return av.done&&av.done[o.k]; }).length;
    var dues=items.map(function(o){ return dueDate(c,k,o.k); });
    var minDue=new Date(Math.min.apply(null, dues));
    var dd=daysTo(minDue);
    return {c:c, items:items, av:av, done:done, total:items.length, due:minDue, dd:dd, complete:done===items.length, overdue:dd<0&&done<items.length};
  }).filter(Boolean);
}

function cobroCalc(x){
  var pagado=(x.abonos||[]).reduce(function(s,a){ return s+(+a.m||0); },0);
  var monto=+x.monto||0;
  var saldo=Math.max(0,+(monto-pagado).toFixed(2));
  var est=x.anulado?'anulado':pagado>=monto&&monto>0?'pagado':pagado>0?'parcial':'pendiente';
  return {pagado:pagado, saldo:saldo, est:est};
}

function estChip(e){
  return {pagado:'<span class="chip ok">Pagado</span>',parcial:'<span class="chip warn">Abono parcial</span>',pendiente:'<span class="chip bad">Pendiente</span>',anulado:'<span class="chip mut">Anulado</span>'}[e];
}

/* ============ BASE DE DATOS ============ */
var COLS=['clientes','cobros','avances','config','boveda','catObl'];
var Store={
  db:null,
  init: async function(){
    var db=null;
    try{ if(window.claude&&window.claude.use) db=await window.claude.use('db'); }catch(e){ db=null; }
    
    setTimeout(function(){
      if(!S.ready){
        S.ready=true;
        render();
      }
    }, 1000);

    if(db){
      this.db=db; S.kind='nube';
      COLS.forEach(function(col){
        db.collection(col).onSnapshot(function(snap){
          var o={}; snap.docs.forEach(function(d){ o[d.id]=d.data(); });
          S[col]=o; loaded[col]=true;
          if(COLS.every(function(c){ return loaded[c]; })){ S.ready=true; render(); }
        }, function(err){
          loaded[col]=true;
          if(COLS.every(function(c){ return loaded[c]; })){ S.ready=true; render(); }
        });
      });
    }else{
      S.kind='local';
      try{
        var raw=localStorage.getItem('bitacora_v1');
        if(raw){ var d=JSON.parse(raw); COLS.forEach(function(c){ S[c]=d[c]||{}; }); }
      }catch(e){}
      S.ready=true;
      render();
    }
  },
  saveLocal: function(){

      var obj={};
      COLS.forEach(function(c){ obj[c]=S[c]; });

    }catch(e){}
  },

    if(this.db){ try{ await this.db.doc(col+'/'+id).set(data); }catch(e){ toast('Error al guardar'); } }

  del: async function(col,id){

    if(this.db){ try{ await this.db.doc(col+'/'+id).delete(); }catch(e){ toast('Error al eliminar'); } }
    else this.saveLocal();
  }
};

/* ============ CIFRADO Y BOVEDA ============ */
var VAULT={key:null,data:[]};
var _enc=new TextEncoder(), _dec=new TextDecoder();
function b64(buf){ var s=''; new Uint8Array(buf).forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

async function deriveKey(pass,salt,iter){
  var km=await crypto.subtle.importKey('raw',_enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encJSON(key,obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,_enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decJSON(key,d){
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(d.ct));
  return JSON.parse(_dec.decode(pt));
}

async function loadVaultItems(){
  if(!VAULT.key||!S.boveda.items) { VAULT.data = []; return; }
  try { VAULT.data = await decJSON(VAULT.key, S.boveda.items); } catch(e) { VAULT.data = []; }
}

async function saveVaultItems(){
  if(!VAULT.key) return;
  var enc = await encJSON(VAULT.key, VAULT.data);
  await Store.put('boveda', 'items', enc);
}

function cellInfoAnual(c, y, mNum) {
  var mKey = monthKey(y, mNum);
  if (!aplica(c, mKey)) return { s: 'na' };

  var mItems = oblFor(c, 'M');
  var mAv = avanceOf(c.id, mKey);

  var aItemsInMonth = oblFor(c, 'A').filter(function(o){ return oblMonthIndex(c, o.k) === mNum; });
  var aAv = avanceOf(c.id, String(y));

  var totalItems = mItems.length + aItemsInMonth.length;
  if (totalItems === 0) return { s: 'na' };

  var doneCount = 0, hasOverdue = false, minDays = 999;

  mItems.forEach(function(o){
    if (mAv.done && mAv.done[o.k]) doneCount++;
    else {
      var dd = daysTo(dueDate(c, mKey, o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  aItemsInMonth.forEach(function(o){
    if (aAv.done && aAv.done[o.k]) doneCount++;
    else {
      var dd = daysTo(dueDate(c, String(y), o.k));
      if (dd < 0) hasOverdue = true;
      if (dd < minDays) minDays = dd;
    }
  });

  var status = 'pend';
  if (doneCount === totalItems) status = 'ok';
  else if (hasOverdue) status = 'bad';
  else if (doneCount > 0) status = 'part';

  return { s: status, done: doneCount, total: totalItems, dd: minDays };
}

    nombre:'',ruc:'',tipo:'PERSONA NATURAL',regimen:'GENERAL',
    contabilidad:false,cobra:true,tarifa:0,
    cobroFreq:'M',doc:'recibo',grupo:'',referidoPor:'',
    obl:{F103_104:true,IM_RTA:true,PM:true,RDEP:true,AGP:true,ATS:true},activo:true
  };
  var cat = getOblList();

  var mens = cat.filter(function(o){ return o.f === 'P'; });
  var sem = cat.filter(function(o){ return o.f === 'S'; });
  var anu = cat.filter(function(o){ return o.f === 'A'; });

  var renderObGroup = function(items){
    return items.map(function(o){
      var checked = (c.obl && c.obl[o.k] !== false) ? 'checked' : '';
      return '<label class="ob-item"><input type="checkbox" class="chk-obl" data-k="'+o.k+'" '+checked+'> '+esc(o.n)+'</label>';
    }).join('');
  };

  openModal('<h2>'+(id?'Editar cliente':'Nuevo cliente')+'</h2>'+
  '<div class="fgrid">'+
    '<div class="full"><label>Nombre / Razón Social<input id="m_nombre" value="'+esc(c.nombre)+'"></label></div>'+
    '<div><label>RUC<input id="m_ruc" value="'+esc(c.ruc)+'"></label></div>'+
    '<div><label>Tipo de Contribuyente<select id="m_tipo"><option value="PERSONA NATURAL" '+(c.tipo==='PERSONA NATURAL'?'selected':'')+'>Persona Natural</option><option value="SOCIEDAD" '+(c.tipo==='SOCIEDAD'?'selected':'')+'>Sociedad</option></select></label></div>'+
    '<div class="full"><label>Grupo / Holding<input id="m_grupo" value="'+esc(c.grupo)+'"></label></div>'+
    '<div><label>Estado del Cliente<select id="m_activo"><option value="true" '+(c.activo!==false?'selected':'')+'>Activo</option><option value="false" '+(c.activo===false?'selected':'')+'>⏸ Suspendido</option></select></label></div>'+
    
    '<div class="full" style="border-top:1px solid var(--line);padding-top:10px;margin-top:5px">'+
      '<b>Condiciones Comerciales y de Cobro:</b>'+
    '</div>'+
    '<div><label>¿Se le cobra honorarios?<select id="m_cobra"><option value="true" '+(c.cobra!==false?'selected':'')+'>Sí</option><option value="false" '+(c.cobra===false?'selected':'')+'>No (Gratuito / Especial)</option></select></label></div>'+
    '<div><label>Tarifa Referencial ($)<input id="m_tarifa" type="number" step="0.01" value="'+(c.tarifa||'')+'"></label></div>'+
    '<div><label>Frecuencia de Cobro<select id="m_cobroFreq"><option value="M" '+(c.cobroFreq==='M'?'selected':'')+'>Mensual</option><option value="S" '+(c.cobroFreq==='S'?'selected':'')+'>Semestral</option><option value="A" '+(c.cobroFreq==='A'?'selected':'')+'>Anual</option><option value="T" '+(c.cobroFreq==='T'?'selected':'')+'>Por trámite / Eventual</option></select></label></div>'+
    '<div><label>Documento que se emite<select id="m_doc"><option value="factura" '+(c.doc==='factura'?'selected':'')+'>Factura electrónica</option><option value="recibo" '+(c.doc==='recibo'?'selected':'')+'>Recibo / Doc. interno</option><option value="sin" '+(c.doc==='sin'?'selected':'')+'>Sin documento</option></select></label></div>'+

    '<div class="full" style="border-top:1px solid var(--line);padding-top:10px;margin-top:5px">'+
      '<b>Obligaciones Asignadas al Cliente:</b>'+
      '<div class="sec-title">📅 Obligaciones Mensuales</div>'+
      '<div class="ob-grid">'+renderObGroup(mens)+'</div>'+
      (sem.length ? '<div class="sec-title">📆 Obligaciones Semestrales</div><div class="ob-grid">'+renderObGroup(sem)+'</div>' : '')+
      '<div class="sec-title">🗓️ Obligaciones Anuales</div>'+
      '<div class="ob-grid">'+renderObGroup(anu)+'</div>'+
    '</div>'+
  '</div>'+
  '<div class="actions"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveCliente" data-id="'+(id||'')+'">Guardar Cliente</button></div>', true);
}

    '<div><label>Fecha de Cobro<input id="mm_fec" type="date" value="'+todayStr()+'"></label></div>'+

function modalAnDist(cid, y, mNum){
  var c = S.clientes[cid];
  var mKey = monthKey(y, mNum);
  var mItems = oblFor(c, 'M');
  var mAv = avanceOf(cid, mKey);
  var aItemsInMonth = oblFor(c, 'A').filter(function(o){ return oblMonthIndex(c, o.k) === mNum; });
  var aAv = avanceOf(cid, String(y));

  // Calcular el último día del mes (ej. para enero 31-01-2026)
  var ultimoDiaMes = new Date(y, mNum, 0);
  var fechaSugeridaStr = ymd(ultimoDiaMes);

  openModal('<h2>'+esc(c.nombre)+' · '+MESES[mNum-1]+' '+y+'</h2>'+
  (mItems.length?'<b>Mensuales ('+mKey+'):</b><div class="obs" style="margin:6px 0 12px">'+mItems.map(function(o){ return '<button class="ob '+(mAv.done&&mAv.done[o.k]?'done':'')+'" data-a="toggle" data-c="'+cid+'" data-k="'+mKey+'" data-m="'+mNum+'" data-o="'+o.k+'">'+esc(o.n)+'</button>'; }).join('')+'</div>':'')+
  (aItemsInMonth.length?'<b>Anuales ('+y+'):</b><div class="obs" style="margin:6px 0 12px">'+aItemsInMonth.map(function(o){ return '<button class="ob '+(aAv.done&&aAv.done[o.k]?'done':'')+'" data-a="toggle" data-c="'+cid+'" data-k="'+y+'" data-m="'+mNum+'" data-o="'+o.k+'">'+esc(o.n)+'</button>'; }).join('')+'</div>':'')+
  '<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">'+
  '<div style="display:flex;justify-content:space-between;align-items:center">'+
    (c.cobra !== false ? '<button class="btn sm pri" data-a="crearCobroDesdeModal" data-c="'+cid+'" data-m="'+MESES[mNum-1]+' '+y+'" data-fec="'+fechaSugeridaStr+'">+ Generar cuenta por cobrar</button>' : '<span></span>')+
    '<button class="btn" data-a="close">Listo</button>'+
  '</div>');
}

/* ============ MANEJO DE EVENTOS ============ */
var ACT={
  tab:function(d){UI.tab=d.k;render();},
  ctype:function(d){UI.ctype=d.k;UI.cper=defaultPeriod(d.k);render();},
  ayShift:function(d){UI.ay+=+d.dir;render();},
  loginGate:function(){
    var p=val('g_pass_input');
    if(p===gateCfg()){ GATE.logged=true; render(); }
    else toast('Contraseña incorrecta');
  },
  lockApp:function(){ GATE.logged=false; render(); toast('Sesión cerrada'); },
  saveGatePass:function(){
    var p=val('set_gate_pass').trim();
    if(p){ localStorage.setItem('bitacora_gate_pass',p); toast('Clave guardada'); }
    else { localStorage.removeItem('bitacora_gate_pass'); toast('Clave removida'); }
    GATE.logged=true; render();
  },
  removeGatePass:function(){ localStorage.removeItem('bitacora_gate_pass'); toast('Clave removida'); GATE.logged=true; render(); },
  nuevaObl:function(){ modalObl(null); },
  editObl:function(d){ modalObl(d.k); },
  saveObl:async function(d){
    var k=val('mo_k').trim().toUpperCase(), n=val('mo_n').trim(), f=val('mo_f'), m=+val('mo_m'), dVal=val('mo_d');
    if(!k||!n){toast('Ingresa código y nombre');return;}
    
    var item = {k:k, n:n, f:f, m:m, d: dVal==='RUC'?'RUC':+dVal};
    await Store.put('catObl', k, item);
    closeModal(); toast('Obligación guardada');
  },
  delObl:async function(d){
    await Store.del('catObl', d.k);
    toast('Obligación eliminada');
  },
  toggle:async function(d){
    var id=d.c+'__'+d.k, av=clean(avanceOf(d.c,d.k)); av.clienteId=d.c; av.periodo=d.k; av.done=av.done||{};
    if(av.done[d.o]) delete av.done[d.o]; else av.done[d.o]=true;
    await Store.put('avances',id,av);
    if($('#modal').firstChild){
      var mExact = d.m ? Number(d.m) : (d.k.includes('-') ? Number(d.k.split('-')[1]) : 1);
      modalAnDist(d.c, UI.ay, mExact);
    }
  },
  nuevoCobro:function(){ modalCobro(null, '', ''); },
  crearCobroDesdeModal:function(d){ modalCobro(d.c, 'Honorarios / Declaración '+d.m, d.fec); },
  saveCobro:async function(){
    var clienteId=val('mc_cli'), concepto=val('mc_con').trim(), monto=+val('mc_mon'), fechaEmision=val('mc_fec');
    if(!clienteId||!concepto||!monto){toast('Completa cliente, concepto y monto');return;}
    var id='cb_'+uid();
    await Store.put('cobros',id,{id:id,clienteId:clienteId,concepto:concepto,monto:monto,fechaEmision:fechaEmision||todayStr(),abonos:[]});
    closeModal(); toast('Cuenta por cobrar registrada');
  },
  abonarCobro:function(d){ modalAbono(d.id); },
  saveAbono:async function(d){
    var monto = +val('ma_monto'), fec = val('ma_fec');
    if(!monto||!fec){toast('Ingresa monto y fecha');return;}
    var x = clean(S.cobros[d.id]);
    x.abonos = x.abonos || [];
    x.abonos.push({f:fec, m:monto});
    await Store.put('cobros', d.id, x);
    closeModal(); toast('Pago registrado');
  },
  cobroMultiple:function(d){ modalCobroMultiple(d.cid); },
  calcMultTotal:function(){
    var sum = 0;
    document.querySelectorAll('.chk-cobro-mult:checked').forEach(function(chk){
      sum += Number(chk.dataset.saldo||0);
    });
    var el = $('#mm_total'); if(el) el.value = sum.toFixed(2);
  },
  saveCobroMultiple:async function(d){
    var fec = val('mm_fec');
    if(!fec){ toast('Ingresa la fecha de cobro'); return; }

    var selectedChecks = document.querySelectorAll('.chk-cobro-mult:checked');
    if(!selectedChecks.length){ toast('Selecciona al menos una cuenta por cobrar'); return; }

    for(var i=0; i<selectedChecks.length; i++){
      var id = selectedChecks[i].dataset.id;
      var saldo = Number(selectedChecks[i].dataset.saldo);
      var x = clean(S.cobros[id]);
      x.abonos = x.abonos || [];
      x.abonos.push({f:fec, m:saldo});
      await Store.put('cobros', id, x);
    }

    closeModal(); toast('Cobros procesados correctamente');
  },
  imprimirRecibo:function(d){ imprimirReciboCobro(d.id); },
  vSetup:async function(){
    var p=val('v_pass');
    if(!p||p.length<6){toast('Clave mínima de 6 caracteres');return;}
    var salt=crypto.getRandomValues(new Uint8Array(16)),iter=100000,key=await deriveKey(p,salt,iter);
    await Store.put('boveda','meta',{salt:b64(salt),iter:iter,check:await encJSON(key,{ok:'BITACORA'})});
    VAULT.key=key; render(); toast('Bóveda configurada');
  },
  vUnlock:async function(){
    var p=val('v_pass'),m=S.boveda.meta;
    try{
      var key=await deriveKey(p,unb64(m.salt),m.iter);
      var ck=await decJSON(key,m.check);if(ck.ok!=='BITACORA')throw 0;
      VAULT.key=key; await loadVaultItems(); render(); toast('Bóveda abierta');
    }catch(e){toast('Clave incorrecta');}
  },
  vLock:function(){ VAULT.key=null; VAULT.data=[]; render(); toast('Bóveda cerrada'); },
  nuevaClave:function(){ modalClave(); },
  saveClave:async function(){
    var cliSel=val('vk_cli_sel'), cliTxt=val('vk_cli_txt').trim();
    var cli = cliSel || cliTxt;

    var srv = val('vk_srv_sel');
    if(srv==='OTRO') srv = val('vk_srv_txt').trim();

    var usr=val('vk_usr').trim(), pwd=val('vk_pwd').trim();

    if(!cli||!usr||!pwd){toast('Selecciona cliente e ingresa usuario y clave');return;}
    VAULT.data.push({cliente:cli,servicio:srv||'SRI',usuario:usr,clave:pwd});
    await saveVaultItems(); closeModal(); render(); toast('Credencial guardada');
  },
  delClave:async function(d){
    VAULT.data.splice(Number(d.i),1);
    await saveVaultItems(); render(); toast('Credencial eliminada');
  },
  showPass:function(d){
    var el=$('#vp_'+d.i);
    if(el) el.type = el.type==='password'?'text':'password';
  },
  nuevoCliente:function(){ modalCliente(null); },
  editCliente:function(d){ modalCliente(d.id); },
  toggleSuspend:async function(d){
    var c = clean(S.clientes[d.id]);
    if(!c) return;
    c.activo = c.activo === false;
    await Store.put('clientes', d.id, c);
    toast(c.activo ? 'Cliente reactivado' : 'Cliente suspendido');
  },
  saveCliente:function(d){
    var nombre=val('m_nombre').trim(), ruc=val('m_ruc').trim();
    if(!nombre||!ruc){toast('Llena nombre y RUC');return;}
    
    var oblMap = {};
    document.querySelectorAll('.chk-obl').forEach(function(chk){
      oblMap[chk.dataset.k] = chk.checked;
    });

    var c={
      nombre:nombre,
      ruc:ruc,
      tipo:val('m_tipo'),
      grupo:val('m_grupo').trim(),
      activo: val('m_activo') === 'true',
      cobra: val('m_cobra') === 'true',
      tarifa: +val('m_tarifa') || 0,
      cobroFreq: val('m_cobroFreq'),
      doc: val('m_doc'),
      obl: oblMap
    };

    Store.put('clientes', d.id || ('c' + ruc), c);
    closeModal();
    toast('Cliente guardado');
  },
  anCellDist:function(d){ modalAnDist(d.c, +d.y, +d.m); },
  close:function(){ closeModal(); },
  bgclose:function(d,e){ if(e.target.classList.contains('bg'))closeModal(); }
};

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var fn=ACT[b.dataset.a];if(fn)fn(b.dataset,e);
});

document.addEventListener('input',function(e){
  var t=e.target, f=t.dataset&&t.dataset.f;
  if(!f) return;

  if(f==='q_cli' || f==='q_ctrl' || f==='q_anual'){
    UI[f] = t.value;
    var currentPos = t.selectionStart;

    if(UI.tab==='clientes') $('#main').innerHTML = vClientes();
    else if(UI.tab==='control') $('#main').innerHTML = vControl();
    else if(UI.tab==='anual') $('#main').innerHTML = vAnual();

    var inputRef = $('#src_' + f);
    if(inputRef){
      inputRef.focus();
      inputRef.setSelectionRange(currentPos, currentPos);
    }
  }
});

document.addEventListener('change',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;
  if(f==='cper'){UI.cper=t.value;render();}
  else if(f==='fgr'){UI.fgr=t.value;render();}
  else if(f==='srv_sel'){
    var txt=$('#vk_srv_txt');
    if(txt) txt.style.display = t.value==='OTRO'?'block':'none';
  }
  else if(f==='mc_cli_sel'){
    var c = S.clientes[t.value];
    if(c && c.tarifa){
      var mon=$('#mc_mon');
      if(mon) mon.value = c.tarifa;
    }
  }
});

UI.cper=defaultPeriod('M');
Store.init();
</script>
</body>
</html>
