<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de clientes y cobros · ASECONTRIL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f8;--card:#ffffff;--ink:#1b2733;--mut:#66758a;--line:#dde3ea;
  --pri:#0f6b6b;--pri-ink:#ffffff;--pri-soft:#dff1f0;
  --ok:#1a7f4b;--ok-soft:#dcf3e6;--warn:#9a6700;--warn-soft:#fff1cc;--bad:#b42318;--bad-soft:#fde4e1;--info:#2452a4;--info-soft:#e3ebfb;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
    --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
    --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d;--card:#18212b;--ink:#e6edf4;--mut:#93a3b6;--line:#2a3643;
  --pri:#3bb3b0;--pri-ink:#06211f;--pri-soft:#173a3b;
  --ok:#56d08f;--ok-soft:#153a29;--warn:#f0c04d;--warn-soft:#3b3010;--bad:#ff8b7e;--bad-soft:#431c19;--info:#8db0ff;--info-soft:#1b2a4d;
  --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%;display:flex;flex-direction:column}

/* LAYOUT CON MENÚ LATERAL */
.layout{display:flex;flex:1;min-height:100vh}
.sidebar{width:250px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:15px 10px;flex-shrink:0;transition:transform .3s ease;z-index:40}
.sidebar h1{font-size:18px;margin:0 0 20px 10px;color:var(--pri);display:flex;align-items:center;gap:8px}
.sidebar h1 span{font-size:14px;color:var(--mut);font-weight:normal;display:block;margin-top:2px}
.menu-btn{background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:4px;transition:background .2s}
.menu-btn:hover{background:var(--bg)}
.menu-btn.on{background:var(--pri-soft);color:var(--pri)}
.content{flex:1;padding:20px;overflow-y:auto;width:100%;max-width:100%}
.header-movil{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:12px 15px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.header-movil h1{font-size:16px;margin:0;color:var(--pri)}
.btn-menu-movil{background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}

@media (max-width:900px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);box-shadow:2px 0 10px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .header-movil{display:flex}
  .content{padding:15px}
  .overlay.open{display:block}
}

/* ESTILOS GENERALES */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi.bad .n{color:var(--bad)}.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{width:100%;min-height:60px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--pri)}
button.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.btn.sm{padding:4px 9px;font-size:13px}
button.btn.danger{color:var(--bad)}
button.btn.info{background:var(--info-soft);color:var(--info);border-color:transparent}
button.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.nm{font-weight:600}.sm{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mut{background:var(--line);color:var(--mut)}
.obs{display:flex;flex-wrap:wrap;gap:5px}
.ob{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.ob.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.ob.done::before{content:"✓ "}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#modal .bg{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto}
#modal .box.wide{max-width:760px}
#modal h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.fgrid input,.fgrid select{width:100%;margin-top:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2733;color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
table.ym th,table.ym td{padding:5px 4px;text-align:center}
table.ym td:first-child,table.ym th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;max-width:230px}
.cl{display:inline-block;min-width:34px;padding:3px 4px;border-radius:7px;font-size:12px;font-weight:700;border:0;font-family:inherit;cursor:pointer}
.cl.ok{background:var(--ok-soft);color:var(--ok)}.cl.bad{background:var(--bad-soft);color:var(--bad)}
.cl.part{background:var(--warn-soft);color:var(--warn)}.cl.pend{background:var(--line);color:var(--mut)}
.cl.na{background:none;color:var(--line);cursor:default}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:6px}
.ob-item{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.ob-item input{margin:0}
.sec-title{font-size:13px;font-weight:700;color:var(--pri);margin-top:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* ACORDEÓN DASHBOARD */
.acc-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.acc-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--bg);font-weight:600}
.acc-header:hover{background:var(--pri-soft)}
.acc-body{display:none;padding:0;border-top:1px solid var(--line)}
.acc-body.open{display:block}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.acc-row:last-child{border-bottom:0}
.progress-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;width:100px}
.progress-fill{height:100%;background:var(--pri);width:0%;transition:width .3s}

/* IMPRESIÓN */
#print-area { display: none; }
@page { size: A4 portrait; margin: 10mm; }

  html, body { margin:0 !important; padding:0 !important; background:#fff !important; width:100% !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  #print-area .print-card { box-sizing: border-box !important; border:2px solid #0f6b6b !important; padding:12px !important; width:100% !important; max-width:100% !important; margin:0 auto !important; background:#fff !important; }
  #print-area table { display: table !important; width:100% !important; max-width:100% !important; table-layout: fixed !important; border-collapse: collapse !important; margin-bottom:15px !important; box-sizing: border-box !important; }
  #print-area tr { display: table-row !important; box-sizing: border-box !important; }
  #print-area th, #print-area td { display: table-cell !important; border:1px solid #000 !important; padding:4px 5px !important; font-size:11px !important; color:#000 !important; word-wrap: break-word !important; overflow-wrap: break-word !important; word-break: break-word !important; overflow: hidden !important; box-sizing: border-box !important; }
  #print-area th { background-color:#fff !important; font-weight:bold !important; }
}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}.kpi .n{font-size:22px}}
</style>

<header class="header-movil">
  <h1>📒 ASECONTRIL</h1>

<script>
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DEFAULT_OBL=[
  {k:'F103_104',n:'F103 + F104',f:'P',m:0,d:'RUC'},
  {k:'F104_SEM1',n:'F104 Semestral 1 (Ene-Jun)',f:'S',m:7,d:'RUC'},
  {k:'F104_SEM2',n:'F104 Semestral 2 (Jul-Dic)',f:'S',m:1,d:'RUC'},
  {k:'ATS',n:'ATS',f:'P',m:0,d:'RUC'},
  {k:'RDEP',n:'RDEP',f:'A',m:1,d:'RUC'},
  {k:'AGP',n:'AGP',f:'A',m:2,d:'RUC'},
  {k:'APS',n:'APS',f:'A',m:2,d:'RUC'},
  {k:'IM_RTA',n:'Imp. Renta',f:'A',m:3,d:'RUC'},
  {k:'SUPERCIAS',n:'Supercias',f:'A',m:4,d:30},
  {k:'ADI',n:'ADI',f:'A',m:5,d:'RUC'},
  {k:'D_PATRIM',n:'D. Patrimonial',f:'A',m:5,d:'RUC'},
  {k:'PM',n:'Patente Municipal',f:'A',m:6,d:'RUC'},
  {k:'S14',n:'14.o sueldo',f:'A',m:8,d:31},
  {k:'S13',n:'13.er sueldo',f:'A',m:12,d:24}
];
var DIA_POR_DIGITO={1:10,2:12,3:14,4:16,5:18,6:20,7:22,8:24,9:26,0:28};
var TIPOLBL={M:'Mensual',S:'Semestral',A:'Anual'};

var GATE={logged:false};
function gateCfg(){return localStorage.getItem('bitacora_gate_pass')||''}

var S={boveda:{},clientes:{},cobros:{},recibos:{},avances:{},config:{},catObl:{},ready:false,kind:'…'};
var loaded={};
var now=new Date();
var UI={ ay:new Date().getFullYear(), tab:'panel', ctype:'M', cper:null, q_cli:'', q_ctrl:'', q_anual:'', fgr:'todos', ordenAnual:'alfabetico', q_cobros:'', fgr_cobros:'todos' };

function getOblList(){
  var dict = {};
  DEFAULT_OBL.forEach(function(o){ dict[o.k] = Object.assign({}, o); });
  if(S.catObl){ Object.keys(S.catObl).forEach(function(k){ if(S.catObl[k]) dict[k] = S.catObl[k]; }); }
  return Object.values(dict);
}
function $(s){ return document.querySelector(s); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function money(n){ return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(Number(n)||0); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function midnight(){ var d=new Date();d.setHours(0,0,0,0);return d; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(s){ if(!s)return''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtD(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function toast(msg){ var t=document.createElement('div');t.textContent=msg;$('#toast').appendChild(t);setTimeout(function(){t.remove();},3200); }

// ✅ FIX: ptype valida meses 01..12 y rechaza basura
function ptype(k){
  if (!k || typeof k !== 'string') return 'A';
  if (/^\d{4}-(0[1-9]|1[0-2])$/.test(k)) return 'M';
  if (/^\d{4}-S[12]$/.test(k)) return 'S';
  if (/^\d{4}$/.test(k)) return 'A';
  return 'A';
}
// ✅ FIX: plabel protege contra índices inválidos (evita undefined[0])
function plabel(k){
  if(!k) return 'Período Actual';
  var t=ptype(k);
  if(t==='M'){
    var p=k.split('-');
    var mi = (+p[1]) - 1;
    if(p.length > 1 && MESES[mi]) return MESES[mi][0].toUpperCase()+MESES[mi].slice(1)+' '+p[0];
    return String(k);
  }
  if(t==='S'){
    var p2=k.split('-');
    return (p2[1]==='S1'?'1.er semestre ':'2.o semestre ')+p2[0];
  }
  return 'Año '+k;
}
// ✅ FIX: helper para obtener mes numérico desde una clave de período
function mNumFromKey(k){
  if (typeof k !== 'string') return 1;
  if (/^\d{4}-\d\d$/.test(k)) return +k.split('-')[1] || 1;
  if (/^\d{4}-S\d$/.test(k))  return k.endsWith('S1') ? 7 : 1;
  return 1;
}

function monthKey(y,m){ return y+'-'+pad(m); }
// ✅ FIX: maxM acotado a 12 (antes generaba "2026-13".."2026-15" en oct-dic → rompía plabel)
function periodOptions(t){
  var y=now.getFullYear(),m=now.getMonth()+1,out=[];
  if(t==='M'){ for(var yy=y; yy>=2026; yy--){ var maxM = (yy===y)? Math.min(m+3,12) : 12; for(var mm=maxM; mm>=1; mm--) out.push(monthKey(yy,mm)); } }
  if(t==='S'){ for(var yy2=y+1; yy2>=2026; yy2--){ out.push(yy2+'-S2'); out.push(yy2+'-S1'); } }
  if(t==='A'){ for(var yy3=y+1; yy3>=2026; yy3--) out.push(String(yy3)); }
  return out.length ? out : [t==='M'?'2026-01':t==='S'?'2026-S1':'2026'];
}
function defaultPeriod(t){
  var y=now.getFullYear(),m=now.getMonth()+1;
  if(y<2026) return t==='M'?'2026-01':t==='S'?'2026-S1':'2026';
  if(t==='M'){ return m===1?monthKey(y-1,12):monthKey(y,m-1); }
  if(t==='S'){ return m>=7?y+'-S1':(y-1)+'-S2'; }
  return String(y-1);
}
function digito9(ruc){
  var clean = String(ruc||'').replace(/\D/g,'');
  return clean.length >= 9 ? +clean[8] : 0;
}
function dueDate(c, k, oblKey){
  var digito = digito9(c.ruc);
  var diaRuc = DIA_POR_DIGITO[digito] || 28;
  var t = ptype(k);
  if(t==='M'){ var p=k.split('-').map(Number); return new Date(p[0], p[1], diaRuc); }
  if(t==='S'){ var p2=k.split('-S'); return p2[1]==='1'?new Date(+p2[0],6,diaRuc):new Date(+p2[0]+1,0,diaRuc); }
  if(t==='A'){
    var y=+k;
    var target=getOblList().find(function(o){ return o.k===oblKey; });
    var mesIndex=2, diaEspecifico=diaRuc;
    if(target){ mesIndex=(target.m&&target.m>=1)?target.m-1:2; if(target.d!=='RUC'&&Number(target.d)>0) diaEspecifico=Number(target.d); }
    if(oblKey==='IM_RTA') mesIndex=c.tipo==='SOCIEDAD'?3:2;
    else if(oblKey==='PM') mesIndex=(c.tipo==='SOCIEDAD'||c.contabilidad)?5:6;
    return new Date(y+1, mesIndex, diaEspecifico);
  }
  return new Date();
}
function oblMonthIndex(c, oblKey){
  if(oblKey==='IM_RTA') return c.tipo==='SOCIEDAD'?4:3;
  if(oblKey==='PM') return (c.tipo==='SOCIEDAD'||c.contabilidad)?6:7;
  var target=getOblList().find(function(o){ return o.k===oblKey; });
  // ✅ FIX: si m es 0 o no existe, devolver 1 para no perder la obligación del anual
  return target&&typeof target.m==='number'&&target.m>0?target.m:1;
}
function daysTo(d){ return Math.round((d-midnight())/864e5); }
function matchesQ(c, qTerm){
  if(!qTerm) return true;
  var q=qTerm.toLowerCase().trim();
  return (c.nombre||'').toLowerCase().includes(q)||(c.ruc||'').includes(q)||(c.celular||'').includes(q)||(c.grupo||'').toLowerCase().includes(q);
}
function clientesList(){ return Object.entries(S.clientes).map(function(pair){ return Object.assign({},pair[1],{id:pair[0]}); }).sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||'','es'); }); }
function gruposList(){ var set=new Set(clientesList().map(function(c){ return (c.grupo||'').trim(); }).filter(Boolean)); return Array.from(set).sort(function(a,b){ return a.localeCompare(b,'es'); }); }
function tagsCli(c){
  return (c.activo===false?'<span class="chip warn">⏸ Suspendido</span> ':'')+

function searchInput(fieldKey, valStr){ return '<input type="text" id="src_'+fieldKey+'" placeholder="🔍 Buscar cliente, RUC o celular…" value="'+esc(valStr)+'" data-f="'+fieldKey+'" style="min-width:200px">'; }
function activos(){ return clientesList().filter(function(c){ return c.activo!==false; }); }
function cobrosList(){ return Object.entries(S.cobros||{}).map(function(pair){ return Object.assign({},pair[1],{id:pair[0]}); }); }
function recibosList(){ return Object.entries(S.recibos||{}).map(function(pair){ return Object.assign({},pair[1],{id:pair[0]}); }); }
function existeCobro(clienteId, concepto) {
  var conceptoNorm = concepto.trim().toLowerCase();
  return cobrosList().some(function(x){ return x.clienteId === clienteId && !x.anulado && (x.concepto || '').trim().toLowerCase() === conceptoNorm; });
}
function oblFor(c, t){
  return getOblList().filter(function(o){
    if(c.obl && c.obl[o.k] === false) return false;
    if(c.obl && c.obl[o.k] === true) return (t === 'M' ? o.f === 'P' : t === 'S' ? o.f === 'S' : o.f === 'A');
    if(o.k === 'SUPERCIAS' && c.tipo !== 'SOCIEDAD') return false;
    if(t === 'M') return o.f === 'P';
    if(t === 'S') return o.f === 'S';
    if(t === 'A') return o.f === 'A';
    return false;
  });
}
function avanceOf(cid,k){ return S.avances[cid+'__'+k]||{done:{}}; }
function rowsFor(t,k){
  return activos().map(function(c){
    var items = oblFor(c, t);
    var av = avanceOf(c.id, k);
    var done = items.filter(function(o){ return av.done && av.done[o.k]; }).length;
    var dues = items.length ? items.map(function(o){ return dueDate(c, k, o.k); }) : [new Date()];
    var minDue = new Date(Math.min.apply(null, dues));
    var dd = daysTo(minDue);
    return {c:c, items:items, av:av, done:done, total:items.length, due:minDue, dd:dd, complete: items.length > 0 && done===items.length, overdue:dd<0&&done<items.length};
  });
}
function cobroCalc(x){
  var pagado=(x.abonos||[]).reduce(function(s,a){ return s+(+a.m||0); },0);
  var monto=+x.monto||0;
  var saldo=Math.max(0,+(monto-pagado).toFixed(2));
  var est=x.anulado?'anulado':pagado>=monto&&monto>0?'pagado':pagado>0?'parcial':'pendiente';
  return {pagado:pagado, saldo:saldo, est:est};
}
function estChip(e){ return {pagado:'<span class="chip ok">Pagado</span>',parcial:'<span class="chip warn">Abono parcial</span>',pendiente:'<span class="chip bad">Pendiente</span>',anulado:'<span class="chip mut">Anulado</span>'}[e]; }

/* ============ BASE DE DATOS ============ */
var COLS=['clientes','cobros','recibos','avances','config','boveda','catObl'];
var Store={
  db:null,
  init: async function(){
    var dbConn=null;
    try{ if(window.AppDB&&window.AppDB.use) dbConn=await window.AppDB.use('db'); }catch(e){ dbConn=null; }
    setTimeout(function(){ if(!S.ready){ S.ready=true; render(); } }, 800);
    if(dbConn){
      this.db=dbConn; S.kind='nube';
      COLS.forEach(function(col){
        dbConn.collection(col).onSnapshot(function(snap){
          var o={}; snap.docs.forEach(function(d){ o[d.id]=d.data(); });
          S[col]=o; loaded[col]=true;
          if(COLS.every(function(c){ return loaded[c]; })){ S.ready=true; render(); }
        }, function(err){ loaded[col]=true; if(COLS.every(function(c){ return loaded[c]; })){ S.ready=true; render(); } });
      });
    }else{
      S.kind='local';
      try{ var raw=localStorage.getItem('bitacora_v1'); if(raw){ var d=JSON.parse(raw); COLS.forEach(function(c){ S[c]=d[c]||{}; }); } }catch(e){}
      S.ready=true; render();
    }
  },
  saveLocal: function(){ try{ var obj={}; COLS.forEach(function(c){ obj[c]=S[c]; }); localStorage.setItem('bitacora_v1', JSON.stringify(obj)); }catch(e){} },
  put: async function(col,id,data){ data=clean(data); S[col][id]=data; render(); if(this.db){ try{ await this.db.doc(col+'/'+id).set(data); }catch(e){ toast('Error al guardar'); } } else this.saveLocal(); },
  del: async function(col,id){ delete S[col][id]; render(); if(this.db){ try{ await this.db.doc(col+'/'+id).delete(); }catch(e){ toast('Error al eliminar'); } } else this.saveLocal(); },
  // ✅ FIX: ahora usa batch y espera el commit
  clearCollection: async function(col){
    S[col] = {}; render();
    if(this.db){
      try {
        var snap = await this.db.collection(col).get();
        if (snap.empty) return;
        var batch = this.db.batch();
        snap.docs.forEach(function(d){ batch.delete(d.ref); });
        await batch.commit();
      } catch(e){ console.warn('clearCollection error:', e); }
    } else this.saveLocal();
  },
  descargarRespaldo: function(){ var backupData = {}; COLS.forEach(function(c){ backupData[c] = S[c] || {}; }); var jsonStr = JSON.stringify(backupData, null, 2); var blob = new Blob([jsonStr], {type: "application/json"}); var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = "RESPALDO_BITACORA_ASECONTRIL_" + todayStr() + ".json"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); },
  restaurarRespaldo: async function(jsonData){
    try {
      var data = JSON.parse(jsonData);
      for (var i = 0; i < COLS.length; i++) {
        var col = COLS[i];
        if (data[col]) {
          S[col] = data[col];
          if (this.db) {
            var snap = await this.db.collection(col).get();
            var batch = this.db.batch();
            snap.docs.forEach(function(d){ batch.delete(d.ref); });
            await batch.commit();

            var keys = Object.keys(data[col]);
            for (var j = 0; j < keys.length; j++) {
              await this.db.doc(col + '/' + keys[j]).set(data[col][keys[j]]);
            }
          }
        }
      }
      this.saveLocal();
      return true;
    } catch(e) { console.error(e); return false; }
  }
};

/* ============ CIFRADO Y BOVEDA ============ */
var VAULT={key:null,data:[]};
var _enc=new TextEncoder(), _dec=new TextDecoder();
function b64(buf){ var s=''; new Uint8Array(buf).forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function deriveKey(pass,salt,iter){ var km=await crypto.subtle.importKey('raw',_enc.encode(pass),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function encJSON(key,obj){ var iv=crypto.getRandomValues(new Uint8Array(12)); var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,_enc.encode(JSON.stringify(obj))); return {iv:b64(iv),ct:b64(ct)}; }
async function decJSON(key,d){ var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(d.ct)); return JSON.parse(_dec.decode(pt)); }
async function loadVaultItems(){ if(!VAULT.key||!S.boveda.items) { VAULT.data = []; return; } try { VAULT.data = await decJSON(VAULT.key, S.boveda.items); } catch(e) { VAULT.data = []; } }
async function saveVaultItems(){ if(!VAULT.key) return; var enc = await encJSON(VAULT.key, VAULT.data); await Store.put('boveda', 'items', enc); }

function dueChip(r){
  if(r.complete)return '<span class="chip ok">Completo</span>';
  if(r.dd<0)return '<span class="chip bad">Vencido hace '+(-r.dd)+' d · '+fmtD(r.due)+'</span>';
  return '<span class="chip '+(r.dd<=7?'warn':'info')+'">Vence en '+r.dd+' d · '+fmtD(r.due)+'</span>';
}

/* ANUAL */
function cellInfoAnual(c, y, mNum) {
  var mKey = monthKey(y, mNum);
  var mItems = oblFor(c, 'M'); var mAv = avanceOf(c.id, mKey);
  var sItemsInMonth = oblFor(c, 'S').filter(function(o){ return (o.m || (o.k.includes('SEM1')?7:1)) === mNum; });
  var sAv1 = avanceOf(c.id, y + '-S1'); var sAv2 = avanceOf(c.id, y + '-S2');
  var aItemsInMonth = oblFor(c, 'A').filter(function(o){ return oblMonthIndex(c, o.k) === mNum; });
  var aAv = avanceOf(c.id, String(y));
  var totalItems = mItems.length + sItemsInMonth.length + aItemsInMonth.length;
  if (totalItems === 0) return { s: 'na' };
  var doneCount = 0, hasOverdue = false, minDays = 999;
  mItems.forEach(function(o){ if (mAv.done && mAv.done[o.k]) doneCount++; else { var dd = daysTo(dueDate(c, mKey, o.k)); if (dd < 0) hasOverdue = true; if (dd < minDays) minDays = dd; } });
  sItemsInMonth.forEach(function(o){ var isS1 = (o.m === 7 || o.k.includes('SEM1')); var targetAv = isS1 ? sAv1 : sAv2; var targetKey = isS1 ? (y + '-S1') : (y + '-S2'); if (targetAv.done && targetAv.done[o.k]) doneCount++; else { var dd = daysTo(dueDate(c, targetKey, o.k)); if (dd < 0) hasOverdue = true; if (dd < minDays) minDays = dd; } });
  aItemsInMonth.forEach(function(o){ if (aAv.done && aAv.done[o.k]) doneCount++; else { var dd = daysTo(dueDate(c, String(y), o.k)); if (dd < 0) hasOverdue = true; if (dd < minDays) minDays = dd; } });
  var status = 'pend'; if (doneCount === totalItems) status = 'ok'; else if (hasOverdue) status = 'bad'; else if (doneCount > 0) status = 'part';
  return { s: status, done: doneCount, total: totalItems, dd: minDays };
}

function vAnual(){

    var act=cells.filter(function(x){ return x.s!=='na'; });
    var doneCells = act.filter(function(x){return x.s==='ok';}).length;
    return {c:c, cells:cells, tot:act.length, ok:doneCells, bad:act.filter(function(x){return x.s==='bad';}).length, pend:act.filter(function(x){return x.s!=='ok'&&x.s!=='na';}).length, pct: act.length ? doneCells/act.length : 0, ruc9: digito9(c.ruc)};

      '<option value="ruc" '+(ord==='ruc'?'selected':'')+'>Orden por 9.º dígito RUC</option>'+
      '<option value="pendientes" '+(ord==='pendientes'?'selected':'')+'>Orden por Pendientes</option>'+
    '</select>'+
    grpSelect()+ searchInput('q_anual', UI.q_anual)+

function modalNotifCobro(cid){
  var c = S.clientes[cid] || {nombre: 'Cliente', ruc: '', celular: ''};
  var pends = cobrosList().filter(function(x){ return x.clienteId === cid && !x.anulado && cobroCalc(x).saldo > 0; });
  var totalSaldo = pends.reduce(function(s, x){ return s + cobroCalc(x).saldo; }, 0);
  var msg = "🏢 *ASECONTRIL - Asesoría Contable*\n📋 *ESTADO DE CUENTA*\n\nEstimado(a) *" + c.nombre + "* (RUC: " + (c.ruc||'S/N') + "):\n\nDetalle de valores pendientes:\n";
  pends.forEach(function(x){ var calc = cobroCalc(x); msg += "• " + x.concepto + ": *" + money(calc.saldo) + "*\n"; });
  msg += "\n💰 *TOTAL A CANCELAR: " + money(totalSaldo) + "*\n\nAgradecemos su pronta transferencia. Atentos a su comprobante.";
  var cleanNum = (c.celular || '').replace(/\D/g, '');
  if (cleanNum.length === 9 && cleanNum.startsWith('9')) cleanNum = '593' + cleanNum;
  else if (cleanNum.length === 10 && cleanNum.startsWith('09')) cleanNum = '593' + cleanNum.slice(1);
  var wspUrl = cleanNum ? 'https://wa.me/' + cleanNum + '?text=' + encodeURIComponent(msg) : '';
  openModal('<h2>📱 Enviar WhatsApp</h2><p class="sm">Cliente: <b>'+esc(c.nombre)+'</b></p>'+
  '<textarea id="txt_notif_wsp" style="height:220px;font-family:monospace;font-size:13px">'+esc(msg)+'</textarea>'+
  '<div class="actions"><button class="btn" data-a="close">Cerrar</button><button class="btn pri" data-a="copiarWspMsg">📋 Copiar</button>'+
    (wspUrl ? '<a href="'+wspUrl+'" target="_blank" class="btn pri" style="text-decoration:none;background:var(--ok)">📲 Abrir WhatsApp</a>' : '')+'</div>');
}

  nuevaObl:function(){ modalObl(null); },
  editObl:function(d){ modalObl(d.k); },
  saveObl:async function(d){ var k=val('mo_k').trim().toUpperCase(), n=val('mo_n').trim(), f=val('mo_f'), m=+val('mo_m'), dVal=val('mo_d'); if(!k||!n){toast('Ingresa código y nombre');return;} await Store.put('catObl', k, {k:k, n:n, f:f, m:m, d: dVal==='RUC'?'RUC':+dVal}); closeModal(); toast('Guardado'); },
  delObl:async function(d){ await Store.del('catObl', d.k); toast('Eliminado'); },
  toggle:async function(d){
    var id=d.c+'__'+d.k, av=clean(avanceOf(d.c,d.k)); av.clienteId=d.c; av.periodo=d.k; av.done=av.done||{};
    if(av.done[d.o]) delete av.done[d.o]; else av.done[d.o]=true;
    await Store.put('avances',id,av);
    var c = S.clientes[d.c];
    if(c && c.cobra !== false && c.tarifa > 0){
      // ✅ FIX: usar mNumFromKey para no producir NaN con claves semestrales
      var mNum = d.m ? Number(d.m) : mNumFromKey(d.k);
      var yYear = UI.ay;
      var mItems = oblFor(c, 'M'); var mAv = avanceOf(d.c, monthKey(yYear, mNum));
      var sItemsInMonth = oblFor(c, 'S').filter(function(o){ return (o.m || (o.k.includes('SEM1')?7:1)) === mNum; });
      var sAv1 = avanceOf(d.c, yYear + '-S1'); var sAv2 = avanceOf(d.c, yYear + '-S2');
      var aItemsInMonth = oblFor(c, 'A').filter(function(o){ return oblMonthIndex(c, o.k) === mNum; }); var aAv = avanceOf(d.c, String(yYear));
      var doneNames = []; var totalItemsCount = mItems.length + sItemsInMonth.length + aItemsInMonth.length;
      mItems.forEach(function(o){ if (mAv.done && mAv.done[o.k]) doneNames.push(o.n); });
      sItemsInMonth.forEach(function(o){ var isS1 = (o.m === 7 || o.k.includes('SEM1')); var targetAv = isS1 ? sAv1 : sAv2; if (targetAv.done && targetAv.done[o.k]) doneNames.push(o.n); });
      aItemsInMonth.forEach(function(o){ if (aAv.done && aAv.done[o.k]) doneNames.push(o.n); });
      if (totalItemsCount > 0 && doneNames.length === totalItemsCount) {
        var conceptoAuto = 'Honorarios / ' + doneNames.join(', ') + ' - ' + MESES[mNum-1] + ' ' + yYear;
        if(!existeCobro(d.c, conceptoAuto)){
          var cbId = 'cb_' + uid();
          await Store.put('cobros', cbId, {id: cbId, clienteId: d.c, concepto: conceptoAuto, monto: c.tarifa, fechaEmision: ymd(new Date(yYear, mNum, 0)), abonos: []});
          toast('⚡ Cuenta generada automáticamente');
        }
      }
    }
    if($('#modal').firstChild){
      var mExact = d.m ? Number(d.m) : mNumFromKey(d.k);
      modalAnDist(d.c, UI.ay, mExact);
    }
  },
  nuevoCobro:function(){ modalCobro(null, '', ''); },
  crearCobroDesdeModal:function(d){ modalCobro(d.c, d.con, d.fec); },
  // ✅ FIX: un solo uid() para id y para campo id (antes se desincronizaban)

    var newId = 'cb_' + uid();
    await Store.put('cobros', newId, {id: newId, clienteId: clienteId, concepto: concepto, monto: monto, fechaEmision: fechaEmision || todayStr(), abonos: []});
    closeModal(); toast('Registrado');

    var selectedChecks = document.querySelectorAll('.chk-cobro-mult:checked'); if(!selectedChecks.length){ toast('Selecciona al menos una'); return; }
    var reciboId = 'rc_'+uid(); var detalles = []; var totalCobrado = 0;
    for(var i=0; i<selectedChecks.length; i++){
      var id = selectedChecks[i].dataset.id; var saldo = Number(selectedChecks[i].dataset.saldo); var concepto = selectedChecks[i].dataset.concepto;
      detalles.push({concepto: concepto, monto: saldo}); totalCobrado += saldo;
      var x = clean(S.cobros[id]); x.abonos = x.abonos || []; x.abonos.push({f:fec, m:saldo, metodo:metodo, ref:ref, reciboId:reciboId}); x.reciboId = reciboId;
      await Store.put('cobros', id, x);
    }
    await Store.put('recibos', reciboId, {id: reciboId, clienteId: d.cid, fecha: fec, metodoPago: metodo, referencia: ref, montoTotal: totalCobrado, detalles: detalles});
    closeModal(); toast('Procesado'); imprimirReciboMultiple(reciboId);
  },
  eliminarCobroIndividual:async function(d){ if(confirm('¿Eliminar cuenta?')){ await Store.del('cobros', d.id); toast('Eliminado'); } },
  descargarRespaldoManual:function(){ Store.descargarRespaldo(); toast('Respaldo descargado'); },
  abrirModalRestaurar:function(){ modalRestaurar(); },
  ejecutarRestaurar:function(){
    var fileInput = document.getElementById('file_restore');
    if(!fileInput.files.length){ toast('Selecciona un archivo JSON primero'); return; }
    var file = fileInput.files[0];
    var reader = new FileReader();
    reader.onload = async function(e){
      var ok = await Store.restaurarRespaldo(e.target.result);
      if(ok){ toast('Respaldo restaurado correctamente'); closeModal(); setTimeout(function(){ location.reload(); }, 800); }
      else { toast('Error al restaurar respaldo'); }
    };
    reader.readAsText(file);
  },
  abrirModalImportarExcel:function(){ modalImportarExcel(); },
  ejecutarImportarExcel:function(){
    var fileInput = document.getElementById('file_excel');
    if(!fileInput.files.length){ toast('Selecciona un archivo CSV primero'); return; }
    var file = fileInput.files[0];
    var reader = new FileReader();
    reader.onload = async function(e){
      try {
        var text = e.target.result;
        var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
        var count = 0;
        for (var i = 1; i < lines.length; i++) {
          var parts = lines[i].split(/[;,]/).map(function(s){ return s.trim(); });
          if (parts.length >= 2 && parts[0]) {
            var nombre = parts[0];
            var ruc = parts[1] || '';
            var cel = parts[2] || '';
            var grupo = parts[3] || '';
            var tarifa = parseFloat(parts[4]) || 0;
            var id = 'c' + ruc.replace(/\D/g,'');
            await Store.put('clientes', id, {nombre: nombre, ruc: ruc, celular: cel, grupo: grupo, tarifa: tarifa, tipo: 'PERSONA NATURAL', cobra: true, doc: 'recibo', cobroFreq: 'M', obl: {}, activo: true});
            count++;
          }
        }
        closeModal(); toast('✅ ' + count + ' clientes importados correctamente');
      } catch(err) { toast('Error al importar: ' + err.message); }
    };
    reader.readAsText(file);
  },
  borrarTodasCuentas:async function(){ if(confirm('¿Borrar TODAS las cuentas por cobrar y recibos?\n\nSe descargará un respaldo automático.')){ Store.descargarRespaldo(); await Store.clearCollection('cobros'); await Store.clearCollection('recibos'); toast('Restablecido'); } },
  restablecerSistemaCompleto:async function(){ if(confirm('🚨 ¡ATENCIÓN! ¿Restablecer TODO el sistema?\n\nSe descargará un respaldo automático.')){ Store.descargarRespaldo(); for(var i=0; i<COLS.length; i++){ await Store.clearCollection(COLS[i]); } toast('Restablecido'); setTimeout(function(){ location.reload(); }, 1500); } },
  imprimirRecibo:function(d){ imprimirReciboCobro(d.id); },
  imprimirReciboMult:function(d){ imprimirReciboMultiple(d.rid); },
  vSetup:async function(){ var p=val('v_pass'); if(!p||p.length<6){toast('Clave mínima de 6 caracteres');return;} var salt=crypto.getRandomValues(new Uint8Array(16)),iter=100000,key=await deriveKey(p,salt,iter); await Store.put('boveda','meta',{salt:b64(salt),iter:iter,check:await encJSON(key,{ok:'BITACORA'})}); VAULT.key=key; render(); toast('Bóveda configurada'); },
  vUnlock:async function(){ var p=val('v_pass'),m=S.boveda.meta; try{ var key=await deriveKey(p,unb64(m.salt),m.iter); var ck=await decJSON(key,m.check);if(ck.ok!=='BITACORA')throw 0; VAULT.key=key; await loadVaultItems(); render(); toast('Bóveda abierta'); }catch(e){toast('Clave incorrecta');} },
  vLock:function(){ VAULT.key=null; VAULT.data=[]; render(); toast('Bóveda cerrada'); },
  nuevaClave:function(){ modalClave(); },
  saveClave:async function(){ var cliSel=val('vk_cli_sel'), cliTxt=val('vk_cli_txt').trim(); var cli = cliSel || cliTxt; var srv = val('vk_srv_sel'); if(srv==='OTRO') srv = val('vk_srv_txt').trim(); var usr=val('vk_usr').trim(), pwd=val('vk_pwd').trim(); if(!cli||!usr||!pwd){toast('Selecciona cliente e ingresa usuario y clave');return;} VAULT.data.push({cliente:cli,servicio:srv||'SRI',usuario:usr,clave:pwd}); await saveVaultItems(); closeModal(); render(); toast('Credencial guardada'); },
  delClave:async function(d){ VAULT.data.splice(Number(d.i),1); await saveVaultItems(); render(); toast('Eliminada'); },
  showPass:function(d){ var el=$('#vp_'+d.i); if(el) el.type = el.type==='password'?'text':'password'; },
  nuevoCliente:function(){ modalCliente(null); },
  editCliente:function(d){ modalCliente(d.id); },
  toggleSuspend:async function(d){ var c = clean(S.clientes[d.id]); if(!c) return; c.activo = c.activo === false; await Store.put('clientes', d.id, c); toast(c.activo ? 'Reactivado' : 'Suspendido'); },
  saveCliente:function(d){
    var nombre=val('m_nombre').trim(), ruc=val('m_ruc').trim(); if(!nombre||!ruc){toast('Llena nombre y RUC');return;}
    var oblMap = {}; document.querySelectorAll('.chk-obl').forEach(function(chk){ oblMap[chk.dataset.k] = chk.checked; });
    // ✅ FIX: se eliminó cobroFreq (no existe el input); se usa 'M' por defecto
    var c={nombre:nombre,ruc:ruc,celular:val('m_celular').trim(),tipo:val('m_tipo'),grupo:val('m_grupo').trim(),activo: val('m_activo') === 'true',cobra: val('m_cobra') === 'true',tarifa: +val('m_tarifa') || 0,cobroFreq:'M',doc: val('m_doc'),obl: oblMap};
    Store.put('clientes', d.id || ('c' + ruc), c); closeModal(); toast('Cliente guardado');
  },
  anCellDist:function(d){ modalAnDist(d.c, +d.y, +d.m); },
  close:function(){ closeModal(); },
  // ✅ FIX: protege e.target sin classList
  bgclose:function(d,e){ if(e && e.target && e.target.classList && e.target.classList.contains('bg')) closeModal(); }
};

document.addEventListener('click',function(e){ var b=e.target.closest('[data-a]');if(!b)return; var fn=ACT[b.dataset.a];if(fn)fn(b.dataset,e); });
document.addEventListener('input',function(e){
  var t=e.target, f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='q_cli' || f==='q_ctrl' || f==='q_anual' || f==='q_cobros'){
    UI[f] = t.value; var currentPos = t.selectionStart;
    if(UI.tab==='clientes') $('#main').innerHTML = vClientes();
    else if(UI.tab==='control') $('#main').innerHTML = vControl();
    else if(UI.tab==='anual') $('#main').innerHTML = vAnual();
    else if(UI.tab==='cobros') $('#main').innerHTML = vCobros();
    var inputRef = $('#src_' + f); if(inputRef){ inputRef.focus(); inputRef.setSelectionRange(currentPos, currentPos); }
  }
});
document.addEventListener('change',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;
  if(f==='cper'){UI.cper=t.value;render();}
  else if(f==='fgr'){UI.fgr=t.value;render();}
  else if(f==='fgr_cobros'){UI.fgr_cobros=t.value;render();}
  else if(f==='ordenAnual'){UI.ordenAnual=t.value;render();}
  else if(f==='srv_sel'){ var txt=$('#vk_srv_txt'); if(txt) txt.style.display = t.value==='OTRO'?'block':'none'; }
  else if(f==='mc_cli_sel'){ var c = S.clientes[t.value]; if(c && c.tarifa){ var mon=$('#mc_mon'); if(mon) mon.value = c.tarifa; } }
});

UI.cper=defaultPeriod('M');
Store.init();
</script>
